    // GENERADOR GEOMÉTRICO EXACTO DE POLÍGONOS
    function generatePolygonFromExteriorAngles(extAnglesDeg, width, height, padding = 45) {
      const n = extAnglesDeg.length;
      let thetas = [0];
      let currentTheta = 0;
      for (let i = 0; i < n - 1; i++) {
        currentTheta += (extAnglesDeg[i] * Math.PI) / 180;
        thetas.push(currentTheta);
      }

      let L = new Array(n).fill(100);
      const cA = Math.cos(thetas[n - 2]), cB = Math.cos(thetas[n - 1]);
      const sA = Math.sin(thetas[n - 2]), sB = Math.sin(thetas[n - 1]);
      const det = cA * sB - sA * cB;

      if (Math.abs(det) > 1e-4) {
        let sumX = 0, sumY = 0;
        for (let i = 0; i < n - 2; i++) {
          sumX += L[i] * Math.cos(thetas[i]);
          sumY += L[i] * Math.sin(thetas[i]);
        }
        L[n - 2] = (-sumX * sB + sumY * cB) / det;
        L[n - 1] = (sumX * sA - sumY * cA) / det;

        if (L[n - 2] <= 20 || L[n - 1] <= 20) {
          const shift = Math.max(30 - L[n - 2], 30 - L[n - 1], 0);
          for (let i = 0; i < n - 2; i++) L[i] += shift;
          sumX = 0; sumY = 0;
          for (let i = 0; i < n - 2; i++) {
            sumX += L[i] * Math.cos(thetas[i]);
            sumY += L[i] * Math.sin(thetas[i]);
          }
          L[n - 2] = (-sumX * sB + sumY * cB) / det;
          L[n - 1] = (sumX * sA - sumY * cA) / det;
        }
      }

      let rawPoints = [{ x: 0, y: 0 }];
      for (let i = 0; i < n - 1; i++) {
        const last = rawPoints[rawPoints.length - 1];
        rawPoints.push({
          x: last.x + L[i] * Math.cos(thetas[i]),
          y: last.y - L[i] * Math.sin(thetas[i])
        });
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      rawPoints.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      const polyW = maxX - minX || 1;
      const polyH = maxY - minY || 1;
      const availW = width - padding * 2;
      const availH = height - padding * 2;
      const scale = Math.min(availW / polyW, availH / polyH);

      const offsetX = (width - polyW * scale) / 2 - minX * scale;
      const offsetY = (height - polyH * scale) / 2 - minY * scale;

      return rawPoints.map(p => ({
        x: p.x * scale + offsetX,
        y: p.y * scale + offsetY
      }));
    }

    function updateProgress() {

      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function drawArrow(ctx, fromX, fromY, toX, toY, color, headLen = 10) {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function drawPolygonLab(canvasId, vertices, angles, angleLabels) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const n = vertices.length;

      let robotEdge = 0;
      let robotT = 0;
      let state = 'walking';
      let rotT = 0;

      function drawFrame() {
        ctx.clearRect(0, 0, w, h);

        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let i = 1; i < n; i++) ctx.lineTo(vertices[i].x, vertices[i].y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
        ctx.fill();
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 4;
        ctx.stroke();

        for (let i = 0; i < n; i++) {
          const pPrev = vertices[(i - 1 + n) % n];
          const pCurr = vertices[i];
          const pNext = vertices[(i + 1) % n];

          const dx = pCurr.x - pPrev.x;
          const dy = pCurr.y - pPrev.y;
          const len = Math.hypot(dx, dy);
          const ux = dx / len;
          const uy = dy / len;

          const extLen = 42;
          ctx.beginPath();
          ctx.setLineDash([4, 4]);
          ctx.moveTo(pCurr.x, pCurr.y);
          ctx.lineTo(pCurr.x + ux * extLen, pCurr.y + uy * extLen);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.setLineDash([]);

          const dxOut = pNext.x - pCurr.x;
          const dyOut = pNext.y - pCurr.y;
          const startAngle = Math.atan2(uy, ux);
          let endAngle = Math.atan2(dyOut, dxOut);

          let diff = endAngle - startAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          ctx.beginPath();
          ctx.arc(pCurr.x, pCurr.y, 22, startAngle, startAngle + diff, diff < 0);
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
          ctx.stroke();

          const midAngle = startAngle + diff / 2;
          const lx = pCurr.x + Math.cos(midAngle) * 38;
          const ly = pCurr.y + Math.sin(midAngle) * 38;
          ctx.fillStyle = '#fef08a';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`${angleLabels[i]}`, lx - 10, ly + 4);
        }

        let curX, curY, headingAngle;
        const p1 = vertices[robotEdge];
        const p2 = vertices[(robotEdge + 1) % n];
        const p3 = vertices[(robotEdge + 2) % n];

        const edgeAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const nextEdgeAngle = Math.atan2(p3.y - p2.y, p3.x - p2.x);

        let turnDelta = nextEdgeAngle - edgeAngle;
        while (turnDelta < -Math.PI) turnDelta += Math.PI * 2;
        while (turnDelta > Math.PI) turnDelta -= Math.PI * 2;

        if (state === 'walking') {
          curX = p1.x + (p2.x - p1.x) * robotT;
          curY = p1.y + (p2.y - p1.y) * robotT;
          headingAngle = edgeAngle;
          robotT += 0.018;
          if (robotT >= 1) {
            robotT = 1;
            state = 'rotating';
            rotT = 0;
          }
        } else if (state === 'rotating') {
          curX = p2.x;
          curY = p2.y;
          headingAngle = edgeAngle + turnDelta * rotT;
          rotT += 0.035;
          if (rotT >= 1) {
            rotT = 0;
            state = 'walking';
            robotT = 0;
            robotEdge = (robotEdge + 1) % n;
          }
        }

        drawArrow(ctx, curX, curY, curX + Math.cos(headingAngle) * 30, curY + Math.sin(headingAngle) * 30, '#38bdf8', 10);

        ctx.save();
        ctx.translate(curX, curY);
        ctx.rotate(headingAngle);
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fillStyle = '#ec4899';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(4, -4.5, 3, 0, Math.PI * 2);
        ctx.arc(4, 4.5, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(5.5, -4.5, 1.5, 0, Math.PI * 2);
        ctx.arc(5.5, 4.5, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      animInterval = setInterval(drawFrame, 25);
    }

            <div class="space-y-6" id="quiz-p2">
              <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700" data-q="1">
                <p class="font-semibold text-slate-200 mb-3">1. ¿Qué es un polígono?</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
                  <button onclick="checkP2(1, 'A')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">A) Una figura abierta con líneas curvas.</button>
                  <button onclick="checkP2(1, 'B')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">B) Una figura cerrada formada por segmentos rectos.</button>
                  <button onclick="checkP2(1, 'C')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">C) Una figura que siempre tiene cuatro lados.</button>
                  <button onclick="checkP2(1, 'D')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">D) Una figura que solo puede ser regular.</button>
                </div>

              </div>

              <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700" data-q="2">
                <p class="font-semibold text-slate-200 mb-3">2. ¿Qué significa que un polígono sea convexo?</p>

                  <button onclick="checkP2(2, 'A')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">A) Que tiene una entrada hacia adentro.</button>
                  <button onclick="checkP2(2, 'B')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">B) Que todos sus lados son iguales.</button>
                  <button onclick="checkP2(2, 'C')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">C) Que no tiene hundimientos y sus diagonales quedan dentro.</button>
                  <button onclick="checkP2(2, 'D')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">D) Que siempre tiene ángulos rectos.</button>

                  <button onclick="checkP2(3, 'B')" class="p-3 text-left bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">B) Un ángulo que se forma dentro del polígono, entre dos lados.</button>
