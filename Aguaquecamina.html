<style>
:root{--bg:#081527;--panel:#10253c;--panel2:#14314b;--line:#34526d;--cyan:#53e1dc;--violet:#ac92ff;--yellow:#ffd36b;--white:#f7fbff;--dim:#b8cadd;--pink:#ff91bd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{background:radial-gradient(circle at 15% 0%,#153c53 0,transparent 37%),radial-gradient(circle at 90% 80%,#24204d 0,transparent 33%),var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}.app{max-width:1400px;margin:0 auto;padding:18px 26px 24px;min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:13px;letter-spacing:.16em;font-weight:900;color:var(--cyan)}.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tiny{font-size:13px;color:var(--dim)}.btn{background:#1d3b54;color:white;border:1px solid #4b6984;border-radius:13px;padding:11px 16px;font-weight:800;transition:.15s}.btn:hover:not(:disabled){background:#2a536d;transform:translateY(-1px)}.btn.primary{background:linear-gradient(115deg,#11bfb8,#478eea);border:none;color:#04192a}.btn.subtle{background:transparent}.btn.warning{background:#4b2945}.bar{height:6px;background:#213b50;border-radius:10px;overflow:hidden;margin-top:13px}.fill{height:100%;background:linear-gradient(90deg,#48e3d2,#9d96ff);transition:width .35s}.slide{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:28px 0 14px;animation:fade .3s ease}@keyframes fade{from{opacity:.25;transform:translateY(9px)}to{opacity:1;transform:none}}.eyebrow{font-size:clamp(12px,1.3vw,17px);text-transform:uppercase;letter-spacing:.19em;color:var(--cyan);font-weight:900;margin:0 0 10px}.heading{font-size:clamp(34px,4.4vw,69px);line-height:1.06;letter-spacing:-.045em;margin:0 0 16px;max-width:1100px}.lead{font-size:clamp(18px,2vw,28px);color:#d5e8f4;line-height:1.42;margin:0 0 22px;max-width:1090px}.accent{color:var(--cyan)}.secondary{color:var(--yellow)}.panel{background:linear-gradient(150deg,rgba(25,59,85,.94),rgba(15,35,59,.94));border:1px solid #41627d;border-radius:23px;padding:22px 26px;box-shadow:0 14px 40px #020c1733}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:rgba(8,29,50,.7);border:1px solid #41637d;border-radius:19px;padding:22px;min-width:0}.card h3{font-size:clamp(19px,1.75vw,27px);margin:0 0 10px}.card p,.card li{font-size:clamp(16px,1.45vw,21px);line-height:1.45;color:#d7e5f2}.card p:last-child{margin-bottom:0}.bigemoji{font-size:48px;display:block;margin-bottom:9px}.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid #4a7088;background:#153b50;border-radius:30px;padding:7px 13px;font-weight:800;font-size:14px;color:#d1f6f5;margin:3px 5px 5px 0}.question{font-size:clamp(22px,2.45vw,36px);font-weight:850;line-height:1.28}.list{margin:0;padding-left:28px}.list li{font-size:clamp(18px,1.8vw,25px);margin:10px 0;line-height:1.42}.input,textarea{background:#071b2c;border:2px solid #52758f;color:white;padding:13px 15px;border-radius:13px;width:100%;min-width:0;font-size:clamp(17px,1.6vw,23px)}textarea{min-height:105px;resize:vertical}.input.small{width:120px;text-align:center}.label{display:block;font-size:16px;font-weight:800;color:#cbe6f5;margin-bottom:9px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #345169}.bottom>.group{display:flex;gap:8px;align-items:center}.counter{font-size:15px;font-weight:850;color:var(--dim);min-width:68px;text-align:center}.note{font-size:clamp(15px,1.35vw,19px);color:#c8d9e6;line-height:1.45}.highlight{background:#164458;border:1px solid #427987;border-radius:14px;padding:16px 20px}.diagram{width:100%;max-height:310px;display:block;margin:0 auto;overflow:visible}.center{text-align:center}.center .heading,.center .lead{margin-left:auto;margin-right:auto}.hero{font-size:clamp(62px,8vw,110px);line-height:1.2}.timer{font-variant-numeric:tabular-nums;font-size:clamp(64px,8vw,120px);letter-spacing:-.055em;line-height:1.05;font-weight:900;color:var(--cyan)}.vote{min-height:124px;text-align:left;width:100%;background:#0c2940;color:white;border:2px solid #456982;border-radius:18px;padding:18px;font-size:clamp(18px,1.8vw,25px);font-weight:800}.vote.active{border-color:var(--cyan);background:#174e57;box-shadow:inset 0 0 0 1px var(--cyan)}.step{display:flex;gap:18px;align-items:flex-start;border-bottom:1px solid #35536d;padding:9px 0;font-size:clamp(17px,1.55vw,23px);line-height:1.35}.step:last-child{border:0}.num{color:var(--cyan);font-weight:900;min-width:28px}table{width:100%;border-collapse:collapse;font-size:clamp(14px,1.4vw,20px)}th,td{border:1px solid #46647c;padding:10px;text-align:left}th{background:#183c57}td{background:#0d2a40}td input{width:100%;min-width:65px;background:#071e30;color:white;border:1px solid #52758f;border-radius:8px;padding:10px;font-size:19px}td:first-child{font-weight:800}svg text{font-family:system-ui,Segoe UI,sans-serif}.plot{height:240px;display:flex;align-items:flex-end;justify-content:space-evenly;gap:18px;border-bottom:2px solid #7e9bb0;padding:20px 10px 0}.barcol{width:43%;display:flex;align-items:center;flex-direction:column;justify-content:end;gap:7px;height:100%}.plotbar{width:100%;max-width:130px;border-radius:9px 9px 0 0;background:linear-gradient(#5adbdc,#4879e0);min-height:2px;transition:height .4s}.plotlabel{text-align:center;font-weight:700;font-size:13px;min-height:35px}.chartwrap{display:flex;flex-direction:column}.emptychart{color:#d5e1ea;text-align:center;padding:46px 5px;font-size:20px}.printtext{color:#cadde9}.mini{font-size:13px;color:#b6cbdc}.hide{display:none!important}details{background:#102c43;border:1px solid #41637d;padding:15px 20px;border-radius:14px}summary{cursor:pointer;font-size:20px;font-weight:800}.badge{display:inline-block;border:1px solid #567d98;border-radius:100px;padding:7px 12px;font-size:13px;font-weight:900;color:var(--yellow)}@media(max-width:800px){.grid,.grid.three{grid-template-columns:1fr}.app{padding:12px}.slide{padding:18px 0}.panel,.card{padding:15px}.heading{font-size:36px}.diagram{max-height:220px}.topright{justify-content:flex-start}.timer{font-size:64px}}@media print{body{background:white;color:black}.top,.bottom,.bar,.actions{display:none}.app{max-width:none}.slide{color:black}.panel,.card{box-shadow:none;background:white;color:black;border:1px solid #999}}

<body><div class="app"><header class="top"><div class="brand">🔬 LABORATORIO DE IDEAS <span style="color:#8eb5ca">/ 5° A 8° BÁSICO</span></div><div class="topright"><span class="tiny">Lunes 09 · Noviembre 2026</span><button class="btn subtle" id="full" aria-label="Activar pantalla completa">⛶ Pantalla completa</button><button class="btn subtle" id="reset">↺ Reiniciar</button></div></header><div class="bar"><div class="fill" id="progress"></div></div><main id="slide" class="slide" aria-live="polite"></main><footer class="bottom"><div class="group"><button class="btn" id="prev">← Anterior</button><span class="counter" id="counter"></span><button class="btn primary" id="next">Siguiente →</button></div><div class="tiny">Use ← → para avanzar · Las respuestas se guardan en este navegador</div></footer></div>
<script>
(()=>{
'use strict';const TOTAL=16, KEY='agua_camina_lab_2026_dos_papeles_v2';let state={index:0,course:'',hypothesis:'',prediction:'',team:'',vote:'',timerSeconds:0,timerRunning:false,measure:{abs:['','',''],ser:['','','']},conclusion:'',ticket:['','','',''],reflections:['','',''],observations:''};try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){state={...state,...s, timerRunning:false,measure:{...state.measure,...(s.measure||{})}}}}catch(e){}let timerHandle=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,timerRunning:false}))}catch(e){}};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const header=(ey,title,lead='')=>`<p class="eyebrow">${ey}</p><h1 class="heading">${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}`;
const cups=(withPaper=false)=>`<svg class="diagram" viewBox="0 0 900 290" role="img" aria-label="Tres vasos: rojo a la izquierda, vacío en el centro, azul a la derecha. ${withPaper?'Tiras de papel los conectan.':''}"><defs><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#a4dcf2" stop-opacity=".18"/><stop offset=".5" stop-color="#e2f8ff" stop-opacity=".05"/><stop offset="1" stop-color="#9ddff9" stop-opacity=".22"/></linearGradient></defs><path d="M75 86 L105 246 Q108 260 125 260 L233 260 Q250 260 253 246 L285 86Z" fill="url(#glass)" stroke="#9cc9e7" stroke-width="5"/><path d="M96 168H264L244 244Q241 251 228 251H131Q116 251 113 244Z" fill="#ff5673" opacity=".8"/><path d="M357 86L388 246Q390 260 408 260H516Q533 260 536 246L566 86Z" fill="url(#glass)" stroke="#9cc9e7" stroke-width="5"/><path d="M638 86L669 246Q671 260 688 260H796Q814 260 817 246L847 86Z" fill="url(#glass)" stroke="#9cc9e7" stroke-width="5"/><path d="M659 168H827L807 244Q804 251 791 251H695Q679 251 676 244Z" fill="#398bff" opacity=".82"/>${withPaper?`<path d="M166 214L173 79Q177 60 197 61L420 61Q445 61 448 82L452 195" fill="none" stroke="#f8f4d7" stroke-width="23" stroke-linejoin="round"/><path d="M470 195L475 80Q477 61 499 61H722Q742 61 746 82L751 214" fill="none" stroke="#f8f4d7" stroke-width="23" stroke-linejoin="round"/><path d="M166 214L173 79Q177 60 197 61L420 61Q445 61 448 82L452 195M470 195L475 80Q477 61 499 61H722Q742 61 746 82L751 214" fill="none" stroke="#b6aa80" stroke-width="2" stroke-dasharray="8 10"/>`:''}<text x="182" y="284" fill="#ffc5d1" font-size="21" text-anchor="middle">VASO A</text><text x="462" y="284" fill="#e0f1ff" font-size="21" text-anchor="middle">VASO B · VACÍO</text><text x="745" y="284" fill="#bad5ff" font-size="21" text-anchor="middle">VASO C</text></svg>`;
const material=(emo,title,sub)=>`<div class="card"><span class="bigemoji">${emo}</span><h3>${title}</h3><p>${sub}</p></div>`;
const steps=arr=>`<div class="panel">${arr.map((a,i)=>`<div class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${a}</span></div>`).join('')}</div>`;
const cards=arr=>`<div class="grid three">${arr.map(([a,b,c])=>material(a,b,c)).join('')}</div>`;
const tick=(n)=>`<label class="label" for="t${n}">${n+1}. ${['¿Qué interrogante científica investigamos?','¿Qué variable modificamos en la comparación?','¿Qué mostraron los datos de nuestro equipo?','¿Qué cambiaríamos para mejorar el procedimiento?'][n]}</label><textarea id="t${n}" data-ticket="${n}" placeholder="Escribe tu respuesta...">${esc(state.ticket[n])}</textarea>`;
const COURSE_LABELS={'5':'5° básico','6':'6° básico','7':'7° básico','8':'8° básico'};
function courseField(){return `<label class="label" for="course">Curso que realizó la actividad</label><select id="course" class="input" aria-label="Curso que realizó la actividad"><option value="">Seleccionar curso...</option>${Object.entries(COURSE_LABELS).map(([v,n])=>`<option value="${v}" ${state.course===v?'selected':''}>${n}</option>`).join('')}</select>`}
function slides(){return [
()=>`<div class="center"><p class="eyebrow">MISIÓN CIENTÍFICA · 09 DE NOVIEMBRE</p><div class="hero">💧🧪🌈</div><h1 class="heading">EL AGUA<br><span class="accent">QUE CAMINA</span></h1><p class="lead">Un misterio para investigar en equipo. <strong>5° a 8° básico</strong></p><div class="panel" style="max-width:900px;margin:0 auto"><div class="question">¿Puede el agua moverse de un vaso a otro sin que nadie la empuje?</div></div></div>`,
()=>`${header('01 · Observamos antes de explicar','El misterio de los tres vasos','Miren atentamente el montaje. Todavía no lo haremos funcionar.') }<div class="panel">${cups(false)}</div><div class="grid" style="margin-top:15px"><div class="card"><h3>🗣️ Conversen en parejas</h3><p>¿Qué creen que podría suceder si conectamos los vasos usando papel?</p></div><div class="card"><h3>🎯 El reto</h3><p>Propongan una explicación posible, aunque todavía no estén seguros.</p></div></div>`,
()=>`${header('02 · Nuestra pregunta','¿Qué vamos a investigar?','Investigar significa hacer una pregunta, imaginar una respuesta y buscar evidencias para comprobarla.') }<div class="panel"><div class="question">¿Qué sucede cuando intentamos transportar agua mediante distintas clases de papel?</div></div><div class="grid" style="margin-top:18px">${[['❓','Preguntar','¿Qué queremos averiguar?'],['💭','Predecir','¿Qué pensamos que ocurrirá?'],['📏','Observar y medir','¿Qué datos podemos conseguir?'],['🧠','Concluir','¿Qué indican nuestras observaciones?']].map(([a,b,c])=>`<div class="card"><h3>${a} ${b}</h3><p>${c}</p></div>`).join('')}</div>`,
()=>`${header('03 · Preparamos el laboratorio','Materiales que necesitaremos','Antes de comenzar, revisen con su equipo los elementos disponibles.') }<div class="grid"><div class="panel"><h2>Experimento inicial</h2><p class="lead">🥛 3 vasos transparentes<br>💧 Agua<br>🎨 Colorante rojo y azul<br>🧻 Papel absorbente</p></div><div class="panel"><h2>Comparación científica</h2><p class="lead">📄 Servilleta (para comparar con papel absorbente)<br>📏 Regla y tiras del mismo tamaño<br>⏱️ Cronómetro<br>📓 Cuaderno y lápiz<br>🥛 Vasos adicionales si están disponibles</p></div></div><p class="note">⚠️ No ingerir el agua coloreada. Mantener la mesa seca y limpiar derrames.</p>`,
()=>`${header('04 · Desafío 1','Construimos nuestro montaje','Observen el diagrama: solo muestra cómo preparar el experimento, no sus resultados.') }<div class="grid"><div class="panel">${cups(true)}</div>${steps(['Colocar tres vasos en línea.','Poner una cantidad similar de agua en los vasos A y C. Dejar B vacío.','Agregar rojo en A y azul en C.','Unir A con B y B con C mediante dos tiras iguales de papel absorbente.','Dejar el montaje quieto sobre una superficie protegida.'])}</div>`,
()=>`${header('05 · Antes de comenzar','Tu hipótesis es importante','Primero pensamos. Después experimentamos. Ninguna hipótesis se descarta sin observar.') }<div class="grid"><div class="panel">${courseField()}<label class="label" for="team" style="margin-top:15px">Nombre del equipo (opcional)</label><input class="input" id="team" value="${esc(state.team)}" placeholder="Ej.: Exploradores del agua"><label class="label" for="hyp" style="margin-top:22px">Completen: «Yo creo que… porque…»</label><textarea id="hyp" placeholder="Nuestra hipótesis es...">${esc(state.hypothesis)}</textarea></div><div class="card"><h3>🤔 Pistas para pensar, no respuestas</h3><p>¿Hacia dónde podría desplazarse el agua?</p><p>¿Qué cambios podríamos observar en el papel?</p><p>¿Qué podría ocurrir con los colores?</p><span class="badge">NO HAY RESPUESTA MOSTRADA</span></div></div>`,
()=>`${header('06 · ¡Manos a la obra!','Comienza el experimento','Instalen las tiras. Observen y registren sin modificar el montaje.') }<div class="grid"><div class="panel center"><p class="eyebrow">CRONÓMETRO DEL LABORATORIO</p><div class="timer" id="timerDisplay">${fmtTime(state.timerSeconds)}</div><div class="actions" style="justify-content:center"><button class="btn primary" id="timerToggle">${state.timerRunning?'⏸ Pausar':'▶ Iniciar'}</button><button class="btn" id="timerReset">↺ Poner en cero</button></div><p class="note">Puede seguir contando mientras avanzamos por las diapositivas. Mantengan abierta la página.</p></div><div class="panel"><h2>👁️ Diario de observación</h2><p class="note">Describan lo que realmente ven. No escriban lo que creen que «debería» ocurrir.</p><textarea id="observations" placeholder="Minuto, cambios visibles, color, posición del agua...">${esc(state.observations)}</textarea></div></div>`,
()=>`${header('07 · Preguntas mientras esperamos','Observación científica','Sin adelantar explicaciones, anoten qué aspectos del montaje les llaman la atención.') }<div class="grid three">${[['👀','¿Qué cambió primero?','Describe dónde observaste el primer cambio.'],['⏳','¿Qué sucede con el tiempo?','¿Los cambios son inmediatos o graduales?'],['🧻','¿Qué papel cumple el papel?','Escribe una idea que luego podamos discutir.']].map(([a,b,c])=>material(a,b,c)).join('')}</div><div class="highlight" style="margin-top:18px"><strong>Pregunta para conversar:</strong> ¿Qué evidencia necesitaríamos para explicar lo observado? La explicación científica se discutirá después de registrar los resultados.</div>`,
()=>`${header('08 · Nuevo desafío','¿Se comportarán igual ambos papeles?','Antes de probarlos, cada estudiante selecciona una predicción y explica por qué.') }<div class="grid">${[['abs','🧻 Papel absorbente'],['ser','📄 Servilleta']].map(([key,label])=>`<button class="vote ${state.vote===key?'active':''}" data-vote="${key}">${label}<div class="mini" style="margin-top:12px">${state.vote===key?'✓ Mi predicción':'Elegir este material'}</div></button>`).join('')}</div><div class="panel" style="margin-top:16px"><label class="label" for="prediction">¿Por qué elegiste ese papel?</label><textarea id="prediction" placeholder="Creo que... porque...">${esc(state.prediction)}</textarea></div>`,
()=>`${header('09 · Hacemos una prueba justa','¿Qué cambia y qué se mantiene?','Si queremos comparar, hay que organizar el experimento para que la comparación sea válida.') }<div class="grid three">${cardsData([['🔀','Cambiamos solo una cosa','Tipo de papel.'],['📏','Medimos','Distancia recorrida por el agua en cierto tiempo.'],['⚖️','Mantenemos igual','Tamaño de las tiras, nivel de agua, posición, temperatura y tiempo.']])}</div><div class="highlight" style="margin-top:18px"><strong>Desafío grupal:</strong> Si también cambiamos el ancho de una tira, ¿podríamos saber qué causó una diferencia? Justifiquen su respuesta.</div>`,
()=>`${header('10 · Desafío 2','Pongan a prueba los dos papeles','Un equipo de investigación necesita materiales comparables y medidas claras.') }<div class="grid"><div class="panel">${steps(['Preparar dos recipientes con igual cantidad de agua coloreada.','Cortar dos tiras del mismo ancho y largo: una de papel absorbente y otra de servilleta.','Colocar un extremo de cada tira dentro de su vaso a igual profundidad y fijarlas en posición equivalente.','Definir un punto inicial de medición común.','Iniciar el cronómetro y medir el avance visible a 1, 3 y 5 minutos.','Registrar cualquier rotura, deformación o dificultad de observación.'])}</div><div class="panel"><div class="center" style="font-size:80px">🧻 📏 ⏱️</div><h2>Regla de oro</h2><p class="lead">No inventamos datos. Si una medida no puede obtenerse, registramos lo sucedido.</p><p class="note">Se pueden necesitar vasos adicionales o realizar ensayos sucesivos, procurando mantener las condiciones iguales.</p></div></div>`,
()=>`${header('11 · Registro de datos','Nuestra tabla experimental','Escriban aquí lo observado en centímetros. Los campos vacíos significan «sin medir».') }<div class="panel" style="overflow-x:auto"><table><thead><tr><th>Material</th><th>1 minuto · cm</th><th>3 minutos · cm</th><th>5 minutos · cm</th></tr></thead><tbody>${[['abs','Papel absorbente'],['ser','Servilleta']].map(([k,n])=>`<tr><td>${n}</td>${[0,1,2].map(i=>`<td><input type="number" data-measure="${k}" data-col="${i}" min="0" step="0.1" inputmode="decimal" aria-label="${n} ${[1,3,5][i]} minutos" value="${esc(state.measure[k][i])}" placeholder="—"></td>`).join('')}</tr>`).join('')}</tbody></table><div class="actions"><button class="btn" id="csv">↓ Descargar tabla CSV</button><button class="btn" id="clearMeasures">Limpiar mediciones</button></div></div><p class="note">Si el papel se rompe, no se aprecia el frente húmedo o una medición es imposible, dejen esa casilla vacía y anótenlo en su cuaderno.</p>`,
()=>`${header('12 · Transformamos datos en información','¿Qué nos dicen nuestras mediciones?','Este gráfico se construye solamente con las medidas que ustedes registren a los 5 minutos.') }<div class="grid"><div class="panel"><h2>📊 Gráfico de nuestro equipo</h2><div id="chart">${renderChart()}</div></div><div class="panel"><h2>Discusión con evidencia</h2><ul class="list"><li>¿Qué diferencias aparecen en sus datos?</li><li>¿Qué resultado les sorprendió?</li><li>¿Coincidieron con la hipótesis inicial?</li><li>¿Qué limitaciones tuvo la medición?</li></ul></div></div>`,
()=>`${header('13 · Ciencia en conversación','¿Qué explicaciones podríamos proponer?','Compartan las ideas que surjan a partir de las observaciones. No hay una respuesta revelada en pantalla.') }<div class="grid three">${[['🔍','Fibras y espacios','¿Cómo podría influir la estructura del papel?'],['💧','Agua y materiales','¿Qué interacciones podrían participar?'],['🌱','Más allá del vaso','¿En qué otras situaciones se observa transporte de agua?']].map(([a,b,c])=>material(a,b,c)).join('')}</div><p class="note" style="margin-top:20px">Para investigar después: capilaridad, adhesión y cohesión. Son conceptos de estudio, no una conclusión sobre qué material obtuvo el mejor resultado.</p>`,

function cardsData(arr){return arr.map(([a,b,c])=>material(a,b,c)).join('')};function fmtTime(x){return [Math.floor(x/3600),Math.floor(x%3600/60),x%60].filter((_,i)=>i||x>=3600).map(x=>String(x).padStart(2,'0')).join(':')};function validNumber(v){return v!==''&&Number.isFinite(Number(v))&&Number(v)>=0};function renderChart(){const vals=['abs','ser'].map(k=>state.measure[k][2]);if(!vals.some(validNumber))return '<div class="emptychart">Todavía no hay datos de 5 minutos.<br>Vuelvan a la tabla y registren sus mediciones.</div>';const max=Math.max(1,...vals.filter(validNumber).map(Number));return `<div class="plot">${vals.map((v,i)=>`<div class="barcol"><div style="font-weight:900">${validNumber(v)?esc(v)+' cm':'—'}</div><div class="plotbar" style="height:${validNumber(v)?Math.max(2,Number(v)/max*175):2}px;opacity:${validNumber(v)?1:.18}"></div></div>`).join('')}</div><div style="display:flex;justify-content:space-evenly;gap:10px;margin-top:9px">${['Absorbente','Servilleta'].map(v=>`<div class="plotlabel" style="width:45%">${v}</div>`).join('')}</div>`}

 const ctx=document.createElement('canvas').getContext('2d');
 function splitLines(str,maxWidth=contentWidth,size=10.5,bold=false){
   ctx.font=`${bold?'700':'400'} ${size}px Arial`;
   const output=[];
   safeText(str).split(/\r?\n/).forEach(chunk=>{
     if(chunk.trim()===''){output.push('');return}
     let line='';
     for(const original of chunk.split(/\s+/)){
       const words=[];
       if(ctx.measureText(original).width>maxWidth){
         let seg='';
         for(const c of original){
           if(seg&&ctx.measureText(seg+c).width>maxWidth){words.push(seg);seg=c}else seg+=c;
         }
         if(seg)words.push(seg);
       }else words.push(original);
       for(const word of words){
         const candidate=line?line+' '+word:word;
         if(ctx.measureText(candidate).width<=maxWidth)line=candidate;
         else{if(line)output.push(line);line=word}
       }
     }
     if(line)output.push(line);
   });
   return output;
 }

 pages.forEach((page,i)=>{

 });
 let objects=['','<< /Type /Catalog /Pages 2 0 R >>','','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
 const refs=[];

   refs.push(`${pageID} 0 R`);

 pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;

function wire(){const bind=(id,key)=>{let n=$(id);if(n)n.addEventListener('input',()=>{state[key]=n.value;save()})};['team','hypothesis','prediction','observations','conclusion'].forEach((key)=>bind(({hypothesis:'hyp'})[key]||key,key));document.querySelectorAll('[data-vote]').forEach(n=>n.addEventListener('click',()=>{state.vote=n.dataset.vote;save();render()}));document.querySelectorAll('[data-measure]').forEach(n=>n.addEventListener('input',()=>{state.measure[n.dataset.measure][Number(n.dataset.col)]=n.value;save()}));document.querySelectorAll('[data-ticket]').forEach(n=>n.addEventListener('input',()=>{state.ticket[Number(n.dataset.ticket)]=n.value;save()}));if($('timerToggle'))$('timerToggle').onclick=()=>{state.timerRunning=!state.timerRunning;syncTimer();render()};if($('timerReset'))$('timerReset').onclick=()=>{state.timerRunning=false;state.timerSeconds=0;syncTimer();render();save()};if($('course'))$('course').onchange=e=>{state.course=e.target.value;save();const m=$('pdfstatus');if(m)m.textContent=''};if($('csv'))$('csv').onclick=csv;if($('download'))$('download').onclick=report;if($('clearMeasures'))$('clearMeasures').onclick=()=>{if(confirm('¿Limpiar solamente las mediciones?')){state.measure={abs:['','',''],ser:['','','']};save();render()}}}

function go(d){let newidx=Math.max(0,Math.min(TOTAL-1,state.index+d));if(newidx!==state.index){state.index=newidx;render();window.scrollTo({top:0,behavior:'instant'})}}$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};$('reset').onclick=()=>{if(confirm('¿Reiniciar la presentación y borrar todas las respuestas y mediciones guardadas en este navegador?')){state={index:0,course:'',hypothesis:'',prediction:'',team:'',vote:'',timerSeconds:0,timerRunning:false,measure:{abs:['','',''],ser:['','','']},conclusion:'',ticket:['','','',''],reflections:['','',''],observations:''};syncTimer();render()}};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}});render();
