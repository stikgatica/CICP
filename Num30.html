<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Aventura de Números 1 al 30! - Stik Gatica</title>
  <!-- Tipografía amigable para niños -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <!-- Efecto de confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --color-cielo: #4fc3f7;
      --color-sol: #ffca28;
      --color-pasto: #66bb6a;
      --color-fresa: #ff5252;
      --color-morado: #ab47bc;
      --color-naranja: #ff7043;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 60%, #c8e6c9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    header {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Personaje Mascota Superior */
    .mascot-container {
      width: 100px;
      height: 100px;
      margin-bottom: -10px;
      animation: bounce 2s infinite ease-in-out;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #ff5722;
      font-size: 2.2rem;
      margin: 5px 0;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
    }

    /* Autoría y Créditos */
    .author-badge {
      background: #ffffff;
      color: #0288d1;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 20px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      display: inline-block;
      margin-bottom: 8px;
      border: 2px dashed #4fc3f7;
    }

    /* Marcador de estrellas */
    .score-badge {
      background: white;
      padding: 6px 20px;
      border-radius: 25px;
      font-size: 1.25rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border: 3px solid var(--color-sol);
      color: #e65100;
    }

    /* Navegación de modos */
    .nav-modes {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
      max-width: 600px;
    }

    .btn-nav {
      background: white;
      border: 4px solid #fff;
      border-radius: 22px;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-nav:hover {
      transform: translateY(-2px);
    }

    .btn-nav:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    .btn-nav.active {
      color: white;
      transform: scale(1.05);
    }

    .btn-nav-next.active { background: var(--color-fresa); border-color: #ffcdd2; }
    .btn-nav-comp.active { background: var(--color-morado); border-color: #e1bee7; }
    .btn-nav-board.active { background: var(--color-pasto); border-color: #c8e6c9; }

    /* Tarjeta principal del juego */
    .card-game {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 30px;
      padding: 22px;
      width: 100%;
      max-width: 600px;
      min-height: 400px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border: 6px solid #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .prompt-text {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: #37474f;
      margin-bottom: 15px;
    }

    /* MODO 1: TREN ANIMADO */
    .train-track {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .train-engine {
      width: 80px;
      height: 80px;
      animation: chug 1s infinite alternate ease-in-out;
    }

    @keyframes chug {
      from { transform: rotate(-2deg); }
      to { transform: rotate(2deg); }
    }

    .wagon {
      width: 75px;
      height: 80px;
      background: var(--color-cielo);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-family: 'Fredoka One', cursive;
      color: white;
      box-shadow: 0 6px 0 #0288d1;
      border: 3px solid #b3e5fc;
    }

    .wagon.mystery {
      background: #ffd54f;
      box-shadow: 0 6px 0 #ffa000;
      color: #e65100;
      border-color: #fff9c4;
      animation: pulse 1.4s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .options-grid {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .bubble-btn {
      width: 75px;
      height: 75px;
      background: #ff7043;
      border: 3px solid #ffccbc;
      border-radius: 50%;
      color: white;
      font-size: 2.1rem;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      box-shadow: 0 6px 0 #d84315;
      transition: transform 0.15s;
    }

    .bubble-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d84315;
    }

    /* MODO 2: COMPARAR CON ANIMALES */
    .compare-container {
      display: flex;
      gap: 20px;
      margin: 15px 0;
      width: 100%;
      justify-content: center;
    }

    .compare-card {
      flex: 1;
      max-width: 210px;
      background: #f3e5f5;
      border: 4px solid var(--color-morado);
      border-radius: 24px;
      padding: 12px 10px;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 7px 0 #7b1fa2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .compare-card:hover {
      transform: translateY(-4px);
    }

    .compare-card:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #7b1fa2;
    }

    .animal-avatar {
      width: 70px;
      height: 70px;
      margin-bottom: 5px;
    }

    .compare-number {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      color: var(--color-morado);
      line-height: 1;
    }

    .dots-preview {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      margin-top: 8px;
      max-height: 50px;
      overflow: hidden;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #ffb300;
      border-radius: 50%;
    }

    /* MODO 3: TABLERO 1-30 */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      width: 100%;
      max-height: 270px;
      overflow-y: auto;
      padding: 6px;
    }

    .board-cell {
      background: #fff;
      border: 3px solid #81c784;
      border-radius: 14px;
      font-size: 1.3rem;
      padding: 10px 0;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      color: #2e7d32;
      box-shadow: 0 4px 0 #388e3c;
    }

    .board-cell:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #388e3c;
    }

    .robot-companion {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      background: #e8f5e9;
      padding: 8px 15px;
      border-radius: 20px;
      border: 2px dashed #81c784;
      width: 100%;
    }

    .robot-icon {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }

    .counter-display {
      font-size: 1.15rem;
      color: #2e7d32;
      text-align: left;
      font-weight: 700;
      word-break: break-word;
    }

    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    footer {
      margin-top: 18px;
      font-size: 0.95rem;
      color: #455a64;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <!-- Mascota Chipi (Dibujo animado SVG) -->
    <div class="mascot-container">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <!-- Orejas -->
        <circle cx="25" cy="40" r="14" fill="#8d6e63"/>
        <circle cx="25" cy="40" r="8" fill="#d7ccc8"/>
        <circle cx="75" cy="40" r="14" fill="#8d6e63"/>
        <circle cx="75" cy="40" r="8" fill="#d7ccc8"/>
        <!-- Cabeza -->
        <circle cx="50" cy="50" r="32" fill="#a1887f"/>
        <!-- Cara interna -->
        <ellipse cx="50" cy="55" rx="24" ry="20" fill="#d7ccc8"/>
        <!-- Ojos parpadeantes -->
        <ellipse cx="42" cy="48" rx="4" ry="6" fill="#212121"/>
        <circle cx="43" cy="46" r="1.5" fill="#fff"/>
        <ellipse cx="58" cy="48" rx="4" ry="6" fill="#212121"/>
        <circle cx="59" cy="46" r="1.5" fill="#fff"/>
        <!-- Nariz y Boca sonriente -->
        <ellipse cx="50" cy="56" rx="4" ry="3" fill="#5d4037"/>
        <path d="M 44 60 Q 50 67 56 60" stroke="#5d4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Cachetitos sonrojados -->
        <circle cx="36" cy="56" r="4" fill="#ff8a80" opacity="0.6"/>
        <circle cx="64" cy="56" r="4" fill="#ff8a80" opacity="0.6"/>
      </svg>
    </div>

    <h1>¡Aventura de Números! 🌟</h1>
    <div class="author-badge">🎨 Desarrollado por Stik Gatica</div>
    <div class="score-badge">⭐ Estrellas ganadas: <span id="score-counter">0</span></div>
  </header>

  <!-- Botones de Navegación -->
  <div class="nav-modes">
    <button class="btn-nav btn-nav-next active" onclick="setMode('siguiente')">🚂 El Tren</button>
    <button class="btn-nav btn-nav-comp" onclick="setMode('comparar')">🦁 ¿Quién tiene más?</button>
    <button class="btn-nav btn-nav-board" onclick="setMode('tablero')">🤖 Tablero 1 al 30</button>
  </div>

  <!-- Contenedor del Juego -->
  <div class="card-game" id="game-container"></div>

  <footer>
    🌟 Kínder Mágico &bull; Creado con cariño por <strong>Stik Gatica</strong>
  </footer>

  <script>
    let currentMode = 'siguiente';
    let score = 0;

    // Voces amables para niños
    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(texto);
        utter.lang = 'es-ES';
        utter.rate = 0.9;
        utter.pitch = 1.25;
        window.speechSynthesis.speak(utter);
      }
    }

    function celebrarAcierto() {
      score++;
      document.getElementById('score-counter').innerText = score;
      confetti({
        particleCount: 50,
        spread: 70,
        origin: { y: 0.65 }
      });
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn-nav').forEach(btn => btn.classList.remove('active'));
      
      if (mode === 'siguiente') {
        document.querySelector('.btn-nav-next').classList.add('active');
        renderSiguiente();
      } else if (mode === 'comparar') {
        document.querySelector('.btn-nav-comp').classList.add('active');
        renderComparar();
      } else {
        document.querySelector('.btn-nav-board').classList.add('active');
        renderTablero();
      }
    }

    // ==========================================
    // MODO 1: TREN DE NÚMEROS (SECUENCIA)
    // ==========================================
    let secuenciaCorrecta = 0;

    function renderSiguiente() {
      const container = document.getElementById('game-container');
      const n1 = Math.floor(Math.random() * 28) + 1;
      const n2 = n1 + 1;
      secuenciaCorrecta = n2 + 1;

      let opciones = [secuenciaCorrecta];
      while (opciones.length < 3) {
        let fake = Math.floor(Math.random() * 30) + 1;
        if (!opciones.includes(fake)) opciones.push(fake);
      }
      opciones.sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="prompt-text">¿Qué número sigue en el tren? 🚂</div>
        <div class="train-track">
          <!-- Locomotora de Dibujos Animados SVG -->
          <div class="train-engine">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <rect x="25" y="35" width="45" height="40" rx="6" fill="#e53935"/>
              <rect x="55" y="20" width="30" height="55" rx="6" fill="#1e88e5"/>
              <rect x="62" y="28" width="16" height="18" rx="3" fill="#fff"/>
              <rect x="30" y="22" width="12" height="15" fill="#fbc02d"/>
              <!-- Humito animado -->
              <circle cx="36" cy="12" r="5" fill="#b0bec5" opacity="0.8"/>
              <circle cx="42" cy="5" r="4" fill="#cfd8dc" opacity="0.6"/>
              <!-- Ruedas -->
              <circle cx="40" cy="78" r="11" fill="#424242"/>
              <circle cx="40" cy="78" r="4" fill="#eeeeee"/>
              <circle cx="75" cy="78" r="11" fill="#424242"/>
              <circle cx="75" cy="78" r="4" fill="#eeeeee"/>
              <!-- Carita en el tren -->
              <circle cx="35" cy="46" r="2.5" fill="#fff"/>
              <path d="M 33 53 Q 38 58 43 53" stroke="#fff" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="wagon">${n1}</div>
          <div class="wagon">${n2}</div>
          <div class="wagon mystery">?</div>
        </div>
        <div class="options-grid">
          ${opciones.map(opt => `
            <button class="bubble-btn" onclick="checkSiguiente(${opt}, this)">${opt}</button>
          `).join('')}
        </div>
      `;

      hablar(`¿Qué número sigue después de ${n1} y ${n2}?`);
    }

    function checkSiguiente(num, btnElement) {
      if (num === secuenciaCorrecta) {
        hablar(`¡Genial! ¡El número es el ${num}!`);
        celebrarAcierto();
        setTimeout(renderSiguiente, 1200);
      } else {
        hablar(`¡Casi! Inténtalo otra vez.`);
        btnElement.classList.add('shake');
        setTimeout(() => btnElement.classList.remove('shake'), 450);
      }
    }

    // ==========================================
    // MODO 2: COMPARAR (ANIMALES AMIGABLES)
    // ==========================================
    let numA = 0;
    let numB = 0;

    function renderComparar() {
      const container = document.getElementById('game-container');
      numA = Math.floor(Math.random() * 30) + 1;
      do {
        numB = Math.floor(Math.random() * 30) + 1;
      } while (numA === numB);

      const dotsA = Array(numA).fill('<div class="dot"></div>').join('');
      const dotsB = Array(numB).fill('<div class="dot"></div>').join('');

      container.innerHTML = `
        <div class="prompt-text">¿Quién tiene el número MAYOR? 👑</div>
        <div class="compare-container">
          <!-- Tarjeta 1: León -->
          <div class="compare-card" onclick="checkComparar(${numA}, this)">
            <div class="animal-avatar">
              <svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="40" fill="#f57c00"/>
                <circle cx="50" cy="50" r="30" fill="#ffe082"/>
                <circle cx="40" cy="45" r="4" fill="#3e2723"/>
                <circle cx="60" cy="45" r="4" fill="#3e2723"/>
                <polygon points="50,52 45,58 55,58" fill="#e65100"/>
                <path d="M 45 61 Q 50 67 55 61" stroke="#3e2723" stroke-width="2" fill="none"/>
              </svg>
            </div>
            <div class="compare-number">${numA}</div>
            <div class="dots-preview">${dotsA}</div>
          </div>

          <!-- Tarjeta 2: Jirafa -->
          <div class="compare-card" onclick="checkComparar(${numB}, this)">
            <div class="animal-avatar">
              <svg viewBox="0 0 100 100" width="100%" height="100%">
                <rect x="42" y="55" width="16" height="35" rx="5" fill="#fbc02d"/>
                <circle cx="50" cy="42" r="26" fill="#fbc02d"/>
                <!-- Cuernitos -->
                <line x1="42" y1="22" x2="42" y2="14" stroke="#795548" stroke-width="3"/>
                <circle cx="42" cy="13" r="3" fill="#e65100"/>
                <line x1="58" y1="22" x2="58" y2="14" stroke="#795548" stroke-width="3"/>
                <circle cx="58" cy="13" r="3" fill="#e65100"/>
                <!-- Ojos y Nariz -->
                <circle cx="42" cy="38" r="3.5" fill="#212121"/>
                <circle cx="58" cy="38" r="3.5" fill="#212121"/>
                <ellipse cx="50" cy="48" rx="14" ry="9" fill="#fff59d"/>
                <circle cx="46" cy="47" r="1.5" fill="#5d4037"/>
                <circle cx="54" cy="47" r="1.5" fill="#5d4037"/>
              </svg>
            </div>
            <div class="compare-number">${numB}</div>
            <div class="dots-preview">${dotsB}</div>
          </div>
        </div>
      `;

      hablar(`¿Cuál número es mayor? ¿${numA} o ${numB}?`);
    }

    function checkComparar(seleccionado, cardElement) {
      const mayor = Math.max(numA, numB);
      if (seleccionado === mayor) {
        hablar(`¡Súper! El ${mayor} es más grande.`);
        celebrarAcierto();
        setTimeout(renderComparar, 1200);
      } else {
        hablar(`¡Ese es más pequeño! Toca el otro.`);
        cardElement.classList.add('shake');
        setTimeout(() => cardElement.classList.remove('shake'), 450);
      }
    }

    // ==========================================
    // MODO 3: TABLERO INTERACTIVO (ROBOT TITO)
    // ==========================================
    function renderTablero() {
      const container = document.getElementById('game-container');
      let buttonsHtml = '';
      
      for (let i = 1; i <= 30; i++) {
        buttonsHtml += `<button class="board-cell" onclick="tocarNumero(${i})">${i}</button>`;
      }

      container.innerHTML = `
        <div class="prompt-text">¡Toca un número para jugar! 🎈</div>
        <div class="grid-board">${buttonsHtml}</div>
        
        <div class="robot-companion">
          <!-- Robot Animado SVG -->
          <div class="robot-icon">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <line x1="50" y1="20" x2="50" y2="8" stroke="#78909c" stroke-width="4"/>
              <circle cx="50" cy="7" r="5" fill="#ff5722"/>
              <rect x="25" y="20" width="50" height="42" rx="10" fill="#42a5f5"/>
              <rect x="33" y="30" width="34" height="18" rx="4" fill="#fff"/>
              <circle cx="43" cy="38" r="3.5" fill="#29b6f6"/>
              <circle cx="57" cy="38" r="3.5" fill="#29b6f6"/>
              <rect x="42" y="52" width="16" height="4" rx="2" fill="#e0e0e0"/>
            </svg>
          </div>
          <div class="counter-display" id="tablero-display">
            Toca cualquier número de arriba 👆
          </div>
        </div>
      `;
    }

    function tocarNumero(num) {
      const display = document.getElementById('tablero-display');
      const caritas = '⭐'.repeat(num);
      display.innerHTML = `¡El número <strong>${num}</strong>!<br><span style="font-size:0.85rem;">${caritas}</span>`;
      hablar(`${num}`);
    }

    // Arrancar la app
    renderSiguiente();
  </script>
</body>
</html>
