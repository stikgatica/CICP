<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia Ninja: El Arte de Multiplicar</title>
  <style>
    :root {
      --naruto-orange: #ff6f00;
      --naruto-blue: #0277bd;
      --naruto-dark: #212121;
      --naruto-bg: #fff3e0;
      --chakra-color: #00e5ff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff8f00, #ff5722);
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border: 5px solid var(--naruto-dark);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
    }

    .bandana {
      background: #37474f;
      color: white;
      padding: 8px 20px;
      border-radius: 10px;
      display: inline-block;
      font-weight: bold;
      letter-spacing: 2px;
      border: 2px solid #cfd8dc;
      margin-bottom: 15px;
    }

    h1 {
      color: var(--naruto-orange);
      margin: 0 0 10px;
      text-shadow: 2px 2px 0px #000;
    }

    /* Chakra / Barra de Vida */
    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: bold;
      background: #fbe9e7;
      padding: 8px 15px;
      border-radius: 12px;
    }

    .chakra-container {
      height: 14px;
      background: #e0e0e0;
      border-radius: 7px;
      overflow: hidden;
      margin-top: 5px;
      border: 1px solid #757575;
    }

    .chakra-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00b0ff, #00e5ff);
      transition: width 0.3s;
    }

    /* Filtro de Tabla */
    .table-select {
      margin-bottom: 15px;
      font-size: 1rem;
    }
    .table-select select {
      padding: 6px 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid var(--naruto-orange);
      font-weight: bold;
    }

    /* Pantalla de Desafío */
    .mission-box {
      background: var(--naruto-bg);
      border: 3px dashed var(--naruto-orange);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .operation {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--naruto-dark);
      margin: 5px 0;
    }

    /* Suma Iterada y Clones */
    .jutsu-representation {
      background: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      font-size: 1.1rem;
      color: #bf360c;
    }

    .clones-matrix {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 10px 0;
      max-height: 130px;
      overflow-y: auto;
      padding: 5px;
    }

    .clone-group {
      background: #e1f5fe;
      border: 2px solid #0288d1;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* Opciones de Respuesta */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-option {
      background: white;
      border: 3px solid var(--naruto-blue);
      border-radius: 12px;
      padding: 14px;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--naruto-blue);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-option:hover {
      background: var(--naruto-blue);
      color: white;
      transform: scale(1.03);
    }

    .btn-option:active {
      transform: scale(0.97);
    }

    /* Feedback */
    .feedback {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 12px;
      min-height: 30px;
    }

    .correct { color: #2e7d32; }
    .incorrect { color: #c62828; }
  </style>
</head>
<body>

  <div class="container">
    <div class="bandana">🍃 ALDEA DE LA HOJA 🍃</div>
    <h1>¡ENTRENAMIENTO NINJA!</h1>
    
    <div class="status-bar">
      <div>Rango: <span id="rank">Genin</span> 🥷</div>
      <div>Puntos Ninja: <span id="score">0</span> 🍥</div>
    </div>
    
    <div style="font-size: 0.85rem; text-align: left; margin-bottom: 2px;">Chakra:</div>
    <div class="chakra-container">
      <div id="chakraBar" class="chakra-fill"></div>
    </div>
    <br>

    <div class="table-select">
      <label for="tableChoice">Misión de Tabla: </label>
      <select id="tableChoice" onchange="startNewMission()">
        <option value="all">Todas las Tablas (1 al 12)</option>
        <!-- Opciones generadas con JS -->
      </select>
    </div>

    <div class="mission-box">
      <div style="font-size: 0.9rem; font-weight: bold; color: #555;">KAGE BUNSHIN NO JUTSU (MULTICLONES):</div>
      <div class="operation" id="operationText">4 × 3</div>
      
      <!-- Representación Matemática -->
      <div class="jutsu-representation" id="iteratedSumText">
        4 veces 3 = 3 + 3 + 3 + 3
      </div>

      <!-- Representación Visual -->
      <div class="clones-matrix" id="clonesMatrix"></div>
    </div>

    <!-- Respuestas -->
    <div class="options-grid" id="optionsGrid"></div>

    <div class="feedback" id="feedbackText"></div>
  </div>

  <script>
    // Configuración Inicial
    const select = document.getElementById('tableChoice');
    for (let i = 1; i <= 12; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Tabla del ${i}`;
      select.appendChild(opt);
    }

    let score = 0;
    let chakra = 100;
    let factorA = 2;
    let factorB = 3;
    let correctAnswer = 6;

    const ranks = [
      { min: 0, title: "Estudiante de Academia" },
      { min: 50, title: "Genin Novato" },
      { min: 120, title: "Chunin Táctico" },
      { min: 200, title: "Jonin de Élite" },
      { min: 300, title: "¡Hokage de las Matemáticas!" }
    ];

    function updateRank() {
      const currentRank = ranks.slice().reverse().find(r => score >= r.min);
      document.getElementById('rank').textContent = currentRank.title;
    }

    function startNewMission() {
      document.getElementById('feedbackText').textContent = "";
      
      const choice = document.getElementById('tableChoice').value;
      if (choice === 'all') {
        factorA = Math.floor(Math.random() * 12) + 1;
      } else {
        factorA = parseInt(choice);
      }
      factorB = Math.floor(Math.random() * 12) + 1;
      correctAnswer = factorA * factorB;

      // 1. Mostrar Operación
      document.getElementById('operationText').textContent = `${factorA} × ${factorB}`;

      // 2. Mostrar Suma Iterada: factorA veces factorB
      const sumArr = Array(factorA).fill(factorB);
      document.getElementById('iteratedSumText').innerHTML = 
        `<strong>${factorA} veces ${factorB}</strong> es igual a:<br>` + 
        sumArr.join(' + ');

      // 3. Mostrar Representación Gráfica (Grupos de clones)
      const matrix = document.getElementById('clonesMatrix');
      matrix.innerHTML = "";
      
      // Limitamos la cantidad visual si es muy grande para no saturar la pantalla
      for (let g = 0; g < factorA; g++) {
        const group = document.createElement('div');
        group.className = 'clone-group';
        group.title = `Grupo ${g + 1} de ${factorB}`;
        
        let icons = "";
        // Iconos de clones/shurikens
        for (let item = 0; item < factorB; item++) {
          icons += "🥷";
        }
        group.textContent = icons;
        matrix.appendChild(group);
      }

      // 4. Generar Respuestas de Selección Múltiple
      let answers = new Set([correctAnswer]);
      while (answers.size < 4) {
        let diff = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let fake = correctAnswer + diff;
        if (fake > 0 && fake <= 144) answers.add(fake);
      }

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = "";
      Array.from(answers).sort(() => Math.random() - 0.5).forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.textContent = ans;
        btn.onclick = () => checkAnswer(ans, btn);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(chosen, btn) {
      const fb = document.getElementById('feedbackText');
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(b => b.disabled = true);

      if (chosen === correctAnswer) {
        score += 10;
        chakra = Math.min(100, chakra + 10);
        fb.className = "feedback correct";
        fb.textContent = "¡¡DE VERAS!! Jutsu completado con éxito ⚡";
        btn.style.background = "#4caf50";
        btn.style.color = "white";
      } else {
        chakra = Math.max(0, chakra - 20);
        fb.className = "feedback incorrect";
        fb.textContent = `¡Cuidado! ${factorA} veces ${factorB} eran ${correctAnswer}. ¡Recupera tu Chakra! 🌀`;
        btn.style.background = "#f44336";
        btn.style.color = "white";
      }

      document.getElementById('score').textContent = score;
      document.getElementById('chakraBar').style.width = chakra + "%";
      updateRank();

      // Próxima misión automática
      setTimeout(() => {
        if (chakra <= 0) {
          alert("¡Te quedaste sin chakra! Tómate un tazón de Ramen 🍜 y vuelve a intentarlo.");
          chakra = 100;
          score = Math.max(0, score - 15);
          document.getElementById('score').textContent = score;
          document.getElementById('chakraBar').style.width = "100%";
        }
        startNewMission();
      }, 1600);
    }

    // Iniciar juego
    startNewMission();
  </script>
</body>
</html>
