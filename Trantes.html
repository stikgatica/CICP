<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de Teselados · 8° básico</title>
<style>
:root{--bg:#071426;--panel:#10233c;--panel2:#18324f;--stroke:#395673;--ink:#f2f8ff;--muted:#adc2d9;--cyan:#4ce3e7;--pink:#ff79ad;--yellow:#ffd36d;--green:#72efaa;--orange:#ff9f55;--red:#ff6e7d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 0,#173e65 0,#071426 58%);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #547595;background:#203b5d;color:white;border-radius:11px;padding:10px 13px;font-weight:800}button:hover:not(:disabled){background:#315b82}button:disabled{opacity:.35;cursor:not-allowed}button.primary{background:#047e91;border-color:#52e0e8}button.good{background:#146b54;border-color:#72efaa}button.warn{background:#71531d;border-color:#e2b451}button.pink{background:#713850;border-color:#f076aa}input,select,textarea{background:#102944;color:#fff;border:1px solid #537392;border-radius:10px;padding:10px}input[type=range]{accent-color:var(--cyan);width:100%}.app{max-width:1450px;margin:auto;padding:14px 18px 100px}.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#091a30ee;border:1px solid #304c68;border-radius:0 0 16px 16px;padding:11px 15px;backdrop-filter:blur(12px)}.brand{font-weight:900;margin-right:auto}.brand small{display:block;color:var(--cyan);text-transform:uppercase;letter-spacing:.14em;font-size:.68rem}.badge{border:1px solid #456380;border-radius:999px;padding:6px 10px;color:#cdddf0;font-size:.82rem;font-weight:750}.progressTrack{height:7px;background:#1c344e;border-radius:99px;overflow:hidden;flex-basis:100%}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:.3s}.hero,.card{background:#10233ce8;border:1px solid var(--stroke);border-radius:20px;padding:20px;box-shadow:0 12px 32px #0002}.hero{max-width:950px;margin:30px auto}.hero h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:1.03;margin:8px 0 10px}.hero p{line-height:1.55;color:#c8ddef}.objective{border-left:5px solid var(--cyan);background:#17334e;padding:14px;border-radius:9px;line-height:1.5}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.formgrid label{display:block;font-weight:800;margin-bottom:5px}.formgrid input{width:100%}.stage{display:grid;gap:15px}.stageHead{display:flex;gap:13px;align-items:flex-start;background:#10233ce8;border:1px solid var(--stroke);border-radius:18px;padding:17px}.stageNum{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#057f92,#7a5de8);display:grid;place-items:center;font-weight:950;font-size:1.2rem;flex:0 0 auto}.stageHead h1{margin:0;font-size:clamp(1.8rem,3.5vw,3rem)}.stageHead p{margin:4px 0 0;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.08fr .92fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card h2,.card h3{margin-top:0}.note{padding:12px 14px;background:#253650;border-left:4px solid var(--yellow);border-radius:8px;line-height:1.5;color:#fff0ce}.key{padding:12px 14px;background:#173b39;border:1px solid #397b67;border-radius:10px;line-height:1.5}.question{padding:13px;border:1px solid #45617f;border-radius:13px;background:#142b46;margin:10px 0}.qtitle{font-weight:850;margin-bottom:9px}.options{display:grid;gap:7px}.option{display:flex;align-items:center;gap:8px;background:#102944;border:1px solid #42617f;border-radius:9px;padding:9px}.option input{width:auto}.feedback{display:none;margin-top:8px;padding:9px;border-radius:9px;font-weight:750}.feedback.ok{display:block;background:#123f32;color:#9df3c4}.feedback.bad{display:block;background:#542a38;color:#ffc0cc}.board{background:#f9fcff;border:5px solid #294e68;border-radius:16px;overflow:hidden;min-height:350px}.board svg{width:100%;height:auto;display:block;aspect-ratio:1.18;max-height:58vh;touch-action:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.live{min-height:28px;color:#d7f8ff;font-weight:750;margin-top:8px}.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:1.2rem;background:#142e4b;border-radius:10px;padding:10px;text-align:center}.ruleCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{background:#1a3552;border:1px solid #476987;border-radius:12px;padding:12px}.rule b{color:var(--yellow)}.stageFooter{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0d1d32;border:1px solid var(--stroke);padding:12px 15px;border-radius:14px;position:sticky;bottom:8px;z-index:15}.small{font-size:.86rem;color:var(--muted)}.hidden{display:none!important}.opGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.opBtn.active{background:#6a4ec5;border-color:#a997ff}.builderStats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 10px;background:#183451;border-radius:999px;border:1px solid #496887;font-size:.82rem;font-weight:780}.recipeLog{max-height:210px;overflow:auto;background:#0d1d32;border-radius:11px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}textarea{width:100%;min-height:90px}.report{max-width:900px;margin:auto}.teacher{position:fixed;right:16px;bottom:16px;z-index:30;width:min(360px,calc(100vw - 32px));background:#10233c;border:1px solid #557494;border-radius:16px;padding:14px;box-shadow:0 20px 50px #0008}
@media(max-width:900px){.grid2,.grid3,.ruleCards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.opGrid{grid-template-columns:repeat(2,1fr)}.app{padding:10px 10px 100px}.board svg{max-height:46vh}}@media print{body{background:white;color:#111}.top,.stageFooter,.teacher,.noPrint{display:none!important}.app{max-width:none;padding:0}.card,.hero,.stageHead{box-shadow:none;color:#111;background:white;border:1px solid #bbb}.recipeLog{color:#111;background:#f5f5f5}.small{color:#444}}
</style>
</head>
<body>
<div class="app">
  <div id="top" class="top hidden"><div class="brand"><small>Matemática · 8° básico · OA 13</small>Laboratorio de Teselados</div><span id="studentBadge" class="badge"></span><span id="stageBadge" class="badge"></span><span id="timeBadge" class="badge">⏱ 00:00</span><button id="teacherBtn" type="button">Modo profesor</button><div class="progressTrack"><div id="progress" class="progress"></div></div></div>
  <main id="main"></main>
</div>
<div id="teacherPanel" class="teacher hidden"><h3 style="margin-top:0">🔐 Modo profesor</h3><div id="teacherLogin"><input id="teacherPass" type="password" placeholder="Contraseña" style="width:100%"><button id="teacherLoginBtn" class="primary" type="button" style="width:100%;margin-top:8px">Ingresar</button></div><div id="teacherTools" class="hidden"><select id="teacherStage" style="width:100%"></select><div class="controls"><button id="teacherGo" class="primary" type="button">Ir</button><button id="teacherComplete" type="button">Completar etapa</button><button id="teacherReset" type="button">Reiniciar</button><button id="teacherClose" type="button">Cerrar</button></div></div></div>
<script>
const STAGES=[{title:"Recordamos las isometrías",mins:8},{title:"¿Cuándo existe un teselado?",mins:10},{title:"Teselar mediante traslaciones",mins:12},{title:"Reflexión + traslación",mins:12},{title:"Rotación + traslación",mins:14},{title:"Taller: diseña tu mosaico",mins:25},{title:"Desafío final y ticket de salida",mins:9}];
const KEY="teselados8_oa13_v1";const defaultState=()=>({name:"",course:"8° básico",stage:0,done:Array(STAGES.length).fill(false),answers:{},attempts:{},elapsed:0,builder:{cells:{},op:"I"},teacher:false});let state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||"{}"));if(!Array.isArray(state.done)||state.done.length!==STAGES.length)state.done=Array(STAGES.length).fill(false);if(!state.builder)state.builder={cells:{},op:"I"};let ticker=null,activityTick=null;const main=document.getElementById("main");function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function beginSession(){const name=document.getElementById("name").value.trim(),course=document.getElementById("course").value.trim()||"8° básico";if(!name){alert("Escribe tu nombre.");return}state.name=name;state.course=course;save();showApp()}function showApp(){document.getElementById("top").classList.remove("hidden");startClock();render()}function startClock(){clearInterval(ticker);clearInterval(activityTick);ticker=setInterval(()=>{const e=document.getElementById("timeBadge");if(e)e.textContent="⏱ "+fmt(state.elapsed)},1000);activityTick=setInterval(()=>{if(!document.hidden){state.elapsed+=1;save()}},1000)}window.addEventListener("pagehide",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
function startScreen(){document.getElementById("top").classList.add("hidden");main.innerHTML=`<section class="hero"><span class="badge">90 minutos · actividad individual / parejas</span><h1>🧩 Construye el plano</h1><p><b>Teselados con transformaciones isométricas</b></p><div class="objective"><b>Objetivo:</b> Diseñar y construir teselados —mosaicos que cubren el plano sin dejar huecos ni traslaparse— mediante la composición de rotaciones, traslaciones y reflexiones.</div><div class="formgrid"><div><label>Nombre</label><input id="name" value="${esc(state.name)}" placeholder="Nombre del estudiante"></div><div><label>Curso</label><input id="course" value="${esc(state.course)}"></div></div><div class="note"><b>Lo que ya sabes:</b> traslaciones, rotaciones, reflexiones en los ejes X e Y y composiciones de movimientos. Hoy esas herramientas se usarán para repetir una baldosa sin huecos ni superposiciones.</div><div class="controls"><button class="primary" id="begin">Comenzar actividad</button>${state.name?'<button id="resume">Continuar progreso guardado</button>':''}</div></section>`;document.getElementById("begin").onclick=beginSession;const r=document.getElementById("resume");if(r)r.onclick=showApp}
function stageHead(i,sub){return `<div class="stageHead"><div class="stageNum">${i+1}</div><div><h1>${STAGES[i].title}</h1><p>${sub} · tiempo sugerido: ${STAGES[i].mins} min</p></div></div>`}function footer(){const prev=state.stage?`<button id="prev" type="button">← Anterior</button>`:`<span></span>`;const next=state.stage<STAGES.length-1?`<button id="next" class="primary" type="button" ${(!state.done[state.stage]&&!state.teacher)?"disabled":""}>Siguiente →</button>`:`<button id="next" class="primary" type="button" ${(!state.done[state.stage]&&!state.teacher)?"disabled":""}>Ver informe</button>`;return `<div class="stageFooter">${prev}<span class="small">${state.done[state.stage]?"✅ Etapa completada":"Completa la misión para avanzar."}</span>${next}</div>`}function wireFooter(){const p=document.getElementById("prev");if(p)p.onclick=()=>{state.stage--;save();render();scrollTo(0,0)};const n=document.getElementById("next");if(n)n.onclick=()=>{if(!state.done[state.stage]&&!state.teacher)return;if(state.stage===STAGES.length-1)return report();state.stage++;save();render();scrollTo(0,0)}}function markDone(i){state.done[i]=true;save();updateTop();const n=document.getElementById("next");if(n)n.disabled=false}function updateTop(){document.getElementById("studentBadge").textContent=`${state.name} · ${state.course}`;document.getElementById("stageBadge").textContent=`Etapa ${state.stage+1}/7`;document.getElementById("progress").style.width=`${100*state.done.filter(Boolean).length/STAGES.length}%`}function render(){updateTop();const f=[stage0,stage1,stage2,stage3,stage4,stage5,stage6];main.innerHTML=f[state.stage]();wireFooter();setTimeout(()=>{drawStage();wireStage()},20)}
function qMC(id,text,opts,correct){return `<div class="question"><div class="qtitle">${text}</div><div class="options">${opts.map(o=>`<label class="option"><input type="radio" name="${id}" value="${o[0]}"> ${o[1]}</label>`).join("")}</div><button class="checkMC" data-id="${id}" data-correct="${correct}" type="button" style="margin-top:8px">Comprobar</button><div id="fb_${id}" class="feedback"></div></div>`}function checkMC(id,correct){const v=document.querySelector(`input[name="${id}"]:checked`),fb=document.getElementById("fb_"+id);if(!v){fb.className="feedback bad";fb.textContent="Selecciona una opción.";return false}state.attempts[id]=(state.attempts[id]||0)+1;state.answers[id]=v.value;save();const ok=v.value===correct;fb.className="feedback "+(ok?"ok":"bad");fb.textContent=ok?"Correcto.":"Revisa qué se conserva y qué cambia en la transformación.";return ok}
function stage0(){return `<div class="stage">${stageHead(0,"Activamos lo que aprendiste en la clase anterior")}<div class="grid2"><div class="card"><h2>De A → A′ → A″</h2><p>Una composición usa como punto de partida el resultado del movimiento anterior.</p><div class="ruleCards"><div class="rule"><b>Traslación</b><br>(x,y) → (x+a,y+b)</div><div class="rule"><b>Reflexión eje X</b><br>(x,y) → (x,−y)</div><div class="rule"><b>Reflexión eje Y</b><br>(x,y) → (−x,y)</div></div><div class="formula" style="margin-top:10px">90° ↺ en O: (x,y) → (−y,x)</div><div class="note">En esta actividad no usaremos reflexiones en rectas oblicuas: solo eje X y eje Y.</div></div><div class="card"><h2>Animación de repaso</h2><div class="board" id="board0"></div><div class="controls"><button id="demo0" class="primary">▶ Reproducir</button><button id="reset0">↺ Reiniciar</button></div><p id="live0" class="live"></p></div></div><div class="card">${qMC("s0a","Si A(2,1) gira 90° antihorario en el origen, ¿dónde queda?",[["a","(−1,2)"],["b","(1,−2)"],["c","(−2,−1)"]],"a")}${qMC("s0b","Si B(−3,2) se refleja en el eje Y, ¿dónde queda?",[["a","(−3,−2)"],["b","(3,2)"],["c","(3,−2)"]],"b")}${qMC("s0c","¿Qué significa componer dos transformaciones?",[["a","Aplicarlas al mismo tiempo"],["b","Aplicar la segunda sobre el resultado de la primera"],["c","Elegir solo una de ellas"]],"b")}<button id="finish0" class="primary">Completar repaso</button></div>${footer()}</div>`}
function stage1(){return `<div class="stage">${stageHead(1,"Descubre visualmente qué significa cubrir sin huecos ni traslapes")}<div class="grid2"><div class="card"><h2>Laboratorio de separación</h2><p>La baldosa mide <b>2 × 2 unidades</b>. Ajusta los dos vectores de repetición.</p><label>Separación horizontal: <b id="dxVal">2</b> unidades</label><input id="dx" type="range" min="1" max="4" step="1" value="2"><label>Separación vertical: <b id="dyVal">2</b> unidades</label><input id="dy" type="range" min="1" max="4" step="1" value="2"><div id="tileStatus" class="key" style="margin-top:12px"></div><div class="note" style="margin-top:10px">Si la separación es menor que el ancho de la baldosa, se superponen. Si es mayor, quedan huecos.</div></div><div class="card"><div class="board" id="board1"></div></div></div><div class="card">${qMC("s1a","Para una baldosa cuadrada de lado 2, ¿qué vector horizontal permite repetirla sin huecos ni traslapes?",[["a","(1,0)"],["b","(2,0)"],["c","(3,0)"]],"b")}${qMC("s1b","¿Qué dos condiciones debe cumplir un teselado?",[["a","Tener muchos colores"],["b","No dejar huecos ni producir traslapes"],["c","Usar siempre rotaciones"]],"b")}<button id="finish1" class="primary">Validar descubrimiento</button></div>${footer()}</div>`}
function stage2(){return `<div class="stage">${stageHead(2,"Construye primero el patrón más simple: repetir por traslación")}<div class="grid2"><div class="card"><h2>La baldosa base</h2><p>La baldosa está centrada en el origen y mide 2 × 2.</p><p>Para repetirla hacia la derecha necesitamos <b>T(2,0)</b>; hacia arriba, <b>T(0,2)</b>.</p><div class="formula">Baldosa → T(2,0) → T(4,0) → …</div><p class="question">Predice: ¿dónde queda el centro después de tres traslaciones consecutivas T(2,0)?</p><input id="s2x" type="number" placeholder="x final" style="width:120px"><div class="controls"><button id="checkS2x">Comprobar</button></div><div id="fb_s2x" class="feedback"></div></div><div class="card"><div class="board" id="board2"></div><div class="controls"><button id="row2" class="primary">▶ Construir fila</button><button id="plane2">▶ Completar región</button><button id="reset2">↺</button></div><p id="live2" class="live"></p></div></div><div class="card"><h3>En tu cuaderno</h3><p>1. Dibuja una baldosa cuadrada de 2 × 2 centrada en O.</p><p>2. Escribe las coordenadas de los centros después de aplicar T(2,0), T(4,0) y T(6,0).</p><p>3. ¿Qué segundo vector necesitas para construir filas paralelas?</p>${qMC("s2b","¿Cuál vector permite crear una nueva fila justo encima?",[["a","(0,1)"],["b","(0,2)"],["c","(2,2)"]],"b")}<button id="finish2" class="primary">Completar etapa</button></div>${footer()}</div>`}
function stage3(){return `<div class="stage">${stageHead(3,"Cambia la orientación de la baldosa y después colócala en otra posición")}<div class="grid2"><div class="card"><h2>Composición: reflexión → traslación</h2><p>La baldosa tiene una marca interna asimétrica para que puedas reconocer su orientación.</p><select id="refAxis"><option value="Y">Reflexión en eje Y</option><option value="X">Reflexión en eje X</option></select><select id="refMove"><option value="2,0">Luego T(2,0)</option><option value="-2,0">Luego T(−2,0)</option><option value="0,2">Luego T(0,2)</option><option value="0,-2">Luego T(0,−2)</option></select><div class="controls"><button id="play3" class="primary">▶ Animar composición</button><button id="reset3">↺ Reiniciar</button></div><div id="recipe3" class="formula"></div><p class="question">¿Por qué la reflexión no produce huecos dentro de la baldosa cuadrada?</p><textarea id="reflectExplain" placeholder="Escribe una explicación breve...">${esc(state.answers.reflectExplain||"")}</textarea></div><div class="card"><div class="board" id="board3"></div><p id="live3" class="live"></p></div></div><div class="card">${qMC("s3a","Si el centro de una baldosa está en (0,0), se refleja en Y y luego se traslada por (2,0), ¿cuál es el centro final?",[["a","(−2,0)"],["b","(2,0)"],["c","(0,2)"]],"b")}<button id="finish3" class="primary">Completar etapa</button></div>${footer()}</div>`}
function stage4(){return `<div class="stage">${stageHead(4,"Usa giros para crear ritmos visuales sin cambiar el tamaño de la baldosa")}<div class="grid2"><div class="card"><h2>Rotación → traslación</h2><select id="rotAngle"><option value="90">90° antihorario</option><option value="180">180°</option><option value="270">270° antihorario</option></select><select id="rotMove"><option value="2,0">Luego T(2,0)</option><option value="0,2">Luego T(0,2)</option><option value="-2,0">Luego T(−2,0)</option></select><div class="controls"><button id="play4" class="primary">▶ Animar composición</button><button id="block4">Crear bloque 2×2</button><button id="reset4">↺</button></div><div id="recipe4" class="formula"></div><div class="note">Una rotación conserva forma y tamaño. La traslación cambia la posición. Juntas pueden cambiar orientación + posición sin deformar la baldosa.</div></div><div class="card"><div class="board" id="board4"></div><p id="live4" class="live"></p></div></div><div class="card"><h3>Razonamiento</h3>${qMC("s4a","Una baldosa gira 90° en el origen y luego se traslada a (2,0). ¿Qué cambió?",[["a","Solo el tamaño"],["b","La orientación y la posición"],["c","La forma"]],"b")}${qMC("s4b","¿Qué propiedad permite que una copia rotada siga encajando en una celda cuadrada del mismo tamaño?",[["a","La rotación conserva longitudes y ángulos"],["b","La rotación agranda la figura"],["c","El eje Y cambia"]],"a")}<button id="finish4" class="primary">Completar etapa</button></div>${footer()}</div>`}
function opButton(op,label){return `<button class="opBtn ${state.builder.op===op?"active":""}" data-op="${op}" type="button">${label}</button>`}
function stage5(){const count=Object.keys(state.builder.cells||{}).length;return `<div class="stage">${stageHead(5,"Diseña un teselado propio usando las tres transformaciones estudiadas")}<div class="grid2"><div class="card"><h2>Taller de mosaico</h2><p>La baldosa base es un cuadrado de 2 × 2 con un motivo asimétrico. Cada casilla representa una copia sin huecos ni traslapes.</p><p><b>Elige la orientación</b> que tendrá la copia y luego haz clic en una casilla vacía.</p><div class="opGrid">${opButton("I","Sin giro/reflexión")}${opButton("R90","Rotar 90° ↺")}${opButton("R180","Rotar 180°")}${opButton("R270","Rotar 270° ↺")}${opButton("FX","Reflejar eje X")}${opButton("FY","Reflejar eje Y")}</div><div class="controls"><button id="eraseMode">🧽 Borrar casilla</button><button id="clearBuilder">Limpiar todo</button><button id="autoPattern" class="warn">✨ Ejemplo automático</button></div><div class="builderStats"><span class="stat" id="statCount">${count}/25 casillas</span><span class="stat" id="statRot">Rotaciones: 0</span><span class="stat" id="statRef">Reflexiones: 0</span><span class="stat" id="statTr">Traslaciones: ${count}</span></div><div class="note" style="margin-top:10px"><b>Misión:</b> llena las 25 casillas y usa al menos una rotación, una reflexión y una copia sin cambio de orientación. La traslación ocurre al llevar cada copia desde el origen hasta su casilla.</div></div><div class="card"><div class="board" id="builderBoard"></div><p id="builderLive" class="live"></p></div></div><div class="grid2"><div class="card"><h3>Recetas de composición</h3><p class="small">Cada copia registra la orientación aplicada en el origen y la traslación hasta su centro.</p><div id="recipeLog" class="recipeLog"></div></div><div class="card"><h3>Explica tu diseño</h3><label>¿Qué regla visual utilizaste para repetir las orientaciones?</label><textarea id="designExplain" placeholder="Ej.: alterné rotaciones de 90° y reflexiones en Y...">${esc(state.answers.designExplain||"")}</textarea><div class="controls"><button id="validateBuilder" class="primary">Validar teselado</button></div><div id="fb_builder" class="feedback"></div></div></div>${footer()}</div>`}
function stage6(){return `<div class="stage">${stageHead(6,"Integra las ideas: cobertura, composición y explicación")}<div class="grid2"><div class="card"><h2>Desafío 1 · Detecta el error</h2><p>Una estudiante repite una baldosa cuadrada de lado 2 usando T(3,0) para avanzar horizontalmente.</p>${qMC("s6a","¿Qué ocurrirá?",[["a","Habrá traslape"],["b","Quedará un hueco de 1 unidad entre baldosas"],["c","Teselará perfectamente"]],"b")}<h2>Desafío 2 · Composición</h2><p>Una copia se refleja en el eje Y y luego se traslada T(4,−2).</p>${qMC("s6b","¿Qué transformación cambia su orientación?",[["a","La traslación"],["b","La reflexión"],["c","Ambas cambian el tamaño"]],"b")}</div><div class="card"><h2>Ticket de salida</h2><p>Responde con tus palabras:</p><label>1. ¿Qué debe cumplirse para que un mosaico sea un teselado?</label><textarea id="exit1">${esc(state.answers.exit1||"")}</textarea><label>2. ¿Cómo usaste una composición de transformaciones en tu diseño?</label><textarea id="exit2">${esc(state.answers.exit2||"")}</textarea><label>3. ¿Por qué una rotación, traslación o reflexión no deforma la baldosa?</label><textarea id="exit3">${esc(state.answers.exit3||"")}</textarea><div class="controls"><button id="finish6" class="primary">Finalizar actividad</button></div><div id="fb_finish" class="feedback"></div></div></div>${footer()}</div>`}
const NS="http://www.w3.org/2000/svg",W=700,H=590,S=45,OX=W/2,OY=H/2;function E(tag,a={},text){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n}function mp(p){return[OX+p.x*S,OY-p.y*S]}function plane(svg,xmin=-7,xmax=7,ymin=-6,ymax=6){svg.innerHTML="";svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.append(E("rect",{width:W,height:H,fill:"#f9fcff"}));for(let x=xmin;x<=xmax;x++){let [xx]=mp({x,y:0});svg.append(E("line",{x1:xx,y1:0,x2:xx,y2:H,stroke:x===0?"#657487":"#e1e8ef","stroke-width":x===0?2:1}));if(x!==0)svg.append(E("text",{x:xx-5,y:OY+16,fill:"#657487","font-size":12},x))}for(let y=ymin;y<=ymax;y++){let [,yy]=mp({x:0,y});svg.append(E("line",{x1:0,y1:yy,x2:W,y2:yy,stroke:y===0?"#657487":"#e1e8ef","stroke-width":y===0?2:1}));if(y!==0)svg.append(E("text",{x:OX+7,y:yy+4,fill:"#657487","font-size":12},y))}}
function poly(svg,pts,stroke,fill,labels=""){svg.append(E("polygon",{points:pts.map(p=>mp(p).join(",")).join(" "),fill,stroke,"stroke-width":3}));pts.forEach((p,i)=>{const [x,y]=mp(p);svg.append(E("circle",{cx:x,cy:y,r:4.5,fill:stroke}));if(p.label)svg.append(E("text",{x:x+7,y:y-7,fill:stroke,"font-size":14,"font-weight":800},p.label+labels))})}function squarePts(cx=0,cy=0){return[{x:cx-1,y:cy-1},{x:cx+1,y:cy-1},{x:cx+1,y:cy+1},{x:cx-1,y:cy+1}]}const motif=[{x:-.75,y:-.55},{x:.65,y:-.55},{x:.65,y:-.15},{x:-.1,y:-.15},{x:-.1,y:.65},{x:-.75,y:.65}];function transformPoint(p,op){if(op==="R90")return{x:-p.y,y:p.x};if(op==="R180")return{x:-p.x,y:-p.y};if(op==="R270")return{x:p.y,y:-p.x};if(op==="FX")return{x:p.x,y:-p.y};if(op==="FY")return{x:-p.x,y:p.y};return{x:p.x,y:p.y}}function drawTile(svg,cx,cy,op="I",alpha=1){const sq=squarePts(cx,cy);svg.append(E("polygon",{points:sq.map(p=>mp(p).join(",")).join(" "),fill:"#e8f1fa","fill-opacity":alpha,stroke:"#8aa0b5","stroke-width":1.4,"pointer-events":"none"}));const m=motif.map(p=>transformPoint(p,op)).map(p=>({x:p.x+cx,y:p.y+cy}));svg.append(E("polygon",{points:m.map(p=>mp(p).join(",")).join(" "),fill:op.startsWith("R")?"#8055c7":op.startsWith("F")?"#d65f83":"#1687a1","fill-opacity":.76*alpha,stroke:"#26384a","stroke-width":1.5,"pointer-events":"none"}))}function makeSvg(id){const b=document.getElementById(id);if(!b)return null;const s=E("svg");b.append(s);return s}let timers={};function clearTimer(k){if(timers[k]){clearInterval(timers[k]);delete timers[k]}}function drawStage(){if(state.stage===0)draw0();if(state.stage===1)draw1();if(state.stage===2)draw2();if(state.stage===3)draw3();if(state.stage===4)draw4();if(state.stage===5)drawBuilder()}function wireChecks(){document.querySelectorAll(".checkMC").forEach(b=>b.onclick=()=>checkMC(b.dataset.id,b.dataset.correct))}function wireStage(){wireChecks();if(state.stage===0)wire0();if(state.stage===1)wire1();if(state.stage===2)wire2();if(state.stage===3)wire3();if(state.stage===4)wire4();if(state.stage===5)wire5();if(state.stage===6)wire6()}
function draw0(){const s=makeSvg("board0");plane(s);const t=[{x:-3,y:1,label:"A"},{x:-1,y:1,label:"B"},{x:-2,y:3,label:"C"}];poly(s,t,"#177cb2","rgba(23,124,178,.14)")}function wire0(){let step=0;const live=document.getElementById("live0");document.getElementById("demo0").onclick=()=>{clearTimer("d0");step=0;timers.d0=setInterval(()=>{step++;const b=document.getElementById("board0");b.innerHTML="";const s=makeSvg("board0");plane(s);const t=[{x:-3,y:1,label:"A"},{x:-1,y:1,label:"B"},{x:-2,y:3,label:"C"}],t1=t.map(p=>({x:p.x+4,y:p.y,label:p.label})),t2=t1.map(p=>({x:-p.x,y:p.y,label:p.label}));poly(s,t,"#177cb2","rgba(23,124,178,.08)");if(step>=1)poly(s,t1,"#e07b1e","rgba(224,123,30,.10)","′");if(step>=2)poly(s,t2,"#a74298","rgba(167,66,152,.14)","″");live.textContent=step===1?"1.º Traslación T(4,0)":step===2?"2.º Reflexión en eje Y":"Figura inicial";if(step>=2)clearTimer("d0")},850)};document.getElementById("reset0").onclick=()=>{clearTimer("d0");document.getElementById("board0").innerHTML="";draw0();live.textContent=""};document.getElementById("finish0").onclick=()=>{const ok=["s0a","s0b","s0c"].every((id,i)=>checkMC(id,["a","b","b"][i]));if(ok){markDone(0);render()}}}
function draw1(){makeSvg("board1");renderSpacing()}function renderSpacing(){const board=document.getElementById("board1");if(!board)return;board.innerHTML="";const s=makeSvg("board1");plane(s);const dx=Number(document.getElementById("dx")?.value||2),dy=Number(document.getElementById("dy")?.value||2);for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)drawTile(s,i*dx,j*dy,"I",.85);const status=document.getElementById("tileStatus");if(status){status.textContent=dx===2&&dy===2?"✅ Cobertura exacta: no hay huecos ni traslapes.":(dx<2||dy<2)?"⚠️ Hay traslapes: alguna separación es menor que el tamaño de la baldosa.":"🕳️ Hay huecos: alguna separación es mayor que el tamaño de la baldosa."}const a=document.getElementById("dxVal"),b=document.getElementById("dyVal");if(a)a.textContent=dx;if(b)b.textContent=dy}function wire1(){["dx","dy"].forEach(id=>document.getElementById(id).oninput=renderSpacing);document.getElementById("finish1").onclick=()=>{const ok=checkMC("s1a","b")&&checkMC("s1b","b")&&Number(document.getElementById("dx").value)===2&&Number(document.getElementById("dy").value)===2;if(!ok&&(Number(document.getElementById("dx").value)!==2||Number(document.getElementById("dy").value)!==2))alert("Ajusta ambas separaciones hasta obtener cobertura exacta.");if(ok){markDone(1);render()}}}
function draw2(){const s=makeSvg("board2");plane(s);drawTile(s,0,0)}function wire2(){let row=0;document.getElementById("row2").onclick=()=>{clearTimer("r2");row=0;timers.r2=setInterval(()=>{row++;const b=document.getElementById("board2");b.innerHTML="";const s=makeSvg("board2");plane(s);for(let i=0;i<=row;i++)drawTile(s,-4+i*2,0);document.getElementById("live2").textContent=`Aplicando traslaciones horizontales de 2 unidades · ${row+1} baldosas`;if(row>=4)clearTimer("r2")},400)};document.getElementById("plane2").onclick=()=>{const b=document.getElementById("board2");b.innerHTML="";const s=makeSvg("board2");plane(s);for(let x=-4;x<=4;x+=2)for(let y=-4;y<=4;y+=2)drawTile(s,x,y);document.getElementById("live2").textContent="Región cubierta usando T(2,0) y T(0,2)."};document.getElementById("reset2").onclick=()=>{document.getElementById("board2").innerHTML="";draw2();document.getElementById("live2").textContent=""};document.getElementById("checkS2x").onclick=()=>{const v=Number(document.getElementById("s2x").value),fb=document.getElementById("fb_s2x"),ok=v===6;state.answers.s2x=v;save();fb.className="feedback "+(ok?"ok":"bad");fb.textContent=ok?"Correcto: 0 → 2 → 4 → 6.":"Cuenta tres desplazamientos de 2 unidades desde el origen."};document.getElementById("finish2").onclick=()=>{const ok=Number(state.answers.s2x)===6&&checkMC("s2b","b");if(ok){markDone(2);render()}else alert("Completa primero las dos preguntas.")}}
function draw3(){const s=makeSvg("board3");plane(s);drawTile(s,0,0,"I");document.getElementById("recipe3").textContent="Reflexión en Y → T(2,0)"}function wire3(){document.getElementById("play3").onclick=()=>{const axis=document.getElementById("refAxis").value,mv=document.getElementById("refMove").value.split(",").map(Number),op=axis==="X"?"FX":"FY";document.getElementById("recipe3").textContent=`F${axis} → T(${mv[0]},${mv[1]})`;let st=0;clearTimer("p3");timers.p3=setInterval(()=>{st++;const b=document.getElementById("board3");b.innerHTML="";const s=makeSvg("board3");plane(s);drawTile(s,0,0,"I",.35);if(st>=1)drawTile(s,0,0,op,.75);if(st>=2)drawTile(s,mv[0],mv[1],op,1);document.getElementById("live3").textContent=st===1?`1.º Reflexión en eje ${axis}: cambia la orientación.`:`2.º Traslación T(${mv[0]},${mv[1]}): cambia la posición.`;if(st>=2)clearTimer("p3")},850)};document.getElementById("reset3").onclick=()=>{clearTimer("p3");document.getElementById("board3").innerHTML="";draw3();document.getElementById("live3").textContent=""};document.getElementById("finish3").onclick=()=>{state.answers.reflectExplain=document.getElementById("reflectExplain").value.trim();save();const ok=checkMC("s3a","b")&&state.answers.reflectExplain.length>=20;if(!ok&&state.answers.reflectExplain.length<20)alert("Explica brevemente por qué la baldosa conserva su tamaño al reflejarse.");if(ok){markDone(3);render()}}}
function draw4(){const s=makeSvg("board4");plane(s);drawTile(s,0,0,"I");document.getElementById("recipe4").textContent="R90° → T(2,0)"}function wire4(){document.getElementById("play4").onclick=()=>{const a=Number(document.getElementById("rotAngle").value),mv=document.getElementById("rotMove").value.split(",").map(Number),op="R"+a;document.getElementById("recipe4").textContent=`R${a}° → T(${mv[0]},${mv[1]})`;let st=0;clearTimer("p4");timers.p4=setInterval(()=>{st++;const b=document.getElementById("board4");b.innerHTML="";const s=makeSvg("board4");plane(s);drawTile(s,0,0,"I",.3);if(st>=1)drawTile(s,0,0,op,.78);if(st>=2)drawTile(s,mv[0],mv[1],op,1);document.getElementById("live4").textContent=st===1?`1.º Rotación ${a}° alrededor del origen.`:`2.º Traslación T(${mv[0]},${mv[1]}).`;if(st>=2)clearTimer("p4")},850)};document.getElementById("block4").onclick=()=>{const b=document.getElementById("board4");b.innerHTML="";const s=makeSvg("board4");plane(s);[[-1,-1,"I"],[1,-1,"R90"],[1,1,"R180"],[-1,1,"R270"]].forEach(d=>drawTile(s,d[0],d[1],d[2]));document.getElementById("live4").textContent="Bloque 2×2: misma baldosa, cuatro orientaciones, sin huecos."};document.getElementById("reset4").onclick=()=>{document.getElementById("board4").innerHTML="";draw4();document.getElementById("live4").textContent=""};document.getElementById("finish4").onclick=()=>{if(checkMC("s4a","b")&&checkMC("s4b","a")){markDone(4);render()}}}
const centers=[-4,-2,0,2,4];let eraseMode=false;function builderCounts(){const vals=Object.values(state.builder.cells||{}),rot=vals.filter(v=>v.startsWith("R")).length,ref=vals.filter(v=>v.startsWith("F")).length,id=vals.filter(v=>v==="I").length;return{count:vals.length,rot,ref,id}}function drawBuilder(){const s=makeSvg("builderBoard");plane(s,-6,6,-6,6);centers.forEach(cx=>centers.forEach(cy=>{const key=`${cx},${cy}`,op=state.builder.cells[key];const sq=squarePts(cx,cy),pts=sq.map(p=>mp(p).join(",")).join(" ");const hit=E("polygon",{points:pts,fill:op?"transparent":"rgba(170,190,210,.10)",stroke:"#9aabbc","stroke-width":1.2,"data-key":key});hit.style.cursor="pointer";s.append(hit);if(op)drawTile(s,cx,cy,op);const [tx,ty]=mp({x:cx,y:cy});s.append(E("text",{x:tx-8,y:ty+4,fill:op?"#203040":"#a0adb9","font-size":10,"pointer-events":"none"},op||"+"))}));updateBuilderUI()}function updateBuilderUI(){const c=builderCounts(),a=document.getElementById("statCount");if(!a)return;a.textContent=`${c.count}/25 casillas`;document.getElementById("statRot").textContent=`Rotaciones: ${c.rot}`;document.getElementById("statRef").textContent=`Reflexiones: ${c.ref}`;document.getElementById("statTr").textContent=`Traslaciones: ${c.count}`;const log=document.getElementById("recipeLog"),entries=Object.entries(state.builder.cells||{});log.innerHTML=entries.length?entries.map(([k,op],i)=>{const[x,y]=k.split(","),first=op==="I"?"Sin cambio":op==="FX"?"FX":op==="FY"?"FY":op.replace("R","R")+"°";return `${i+1}. ${first} → T(${x},${y})`}).join("<br>"):"Aún no has colocado baldosas.";document.querySelectorAll(".opBtn").forEach(b=>b.classList.toggle("active",b.dataset.op===state.builder.op))}function wire5(){document.querySelectorAll(".opBtn").forEach(b=>b.onclick=()=>{state.builder.op=b.dataset.op;eraseMode=false;save();updateBuilderUI()});document.getElementById("eraseMode").onclick=()=>{eraseMode=!eraseMode;document.getElementById("eraseMode").classList.toggle("pink",eraseMode);document.getElementById("builderLive").textContent=eraseMode?"Modo borrar: haz clic en una casilla ocupada.":"Modo colocar baldosas."};document.getElementById("builderBoard").querySelector("svg").addEventListener("click",e=>{const hit=e.target.closest("[data-key]");if(!hit)return;const k=hit.dataset.key;if(eraseMode)delete state.builder.cells[k];else state.builder.cells[k]=state.builder.op;save();document.getElementById("builderBoard").innerHTML="";drawBuilder();wire5BuilderOnly()});document.getElementById("clearBuilder").onclick=()=>{if(confirm("¿Borrar todo tu mosaico?")){state.builder.cells={};save();document.getElementById("builderBoard").innerHTML="";drawBuilder();wire5BuilderOnly()}};document.getElementById("autoPattern").onclick=()=>{if(!confirm("Esto reemplazará tu diseño por un ejemplo automático. ¿Continuar?"))return;const ops=["I","R90","FY","R180","FX","R270"];state.builder.cells={};let i=0;centers.forEach(y=>centers.forEach(x=>state.builder.cells[`${x},${y}`]=ops[(i++)%ops.length]));save();document.getElementById("builderBoard").innerHTML="";drawBuilder();wire5BuilderOnly()};document.getElementById("validateBuilder").onclick=()=>{state.answers.designExplain=document.getElementById("designExplain").value.trim();save();const c=builderCounts(),fb=document.getElementById("fb_builder"),ok=c.count===25&&c.rot>=1&&c.ref>=1&&c.id>=1&&state.answers.designExplain.length>=25;fb.className="feedback "+(ok?"ok":"bad");fb.textContent=ok?"✅ Teselado válido: cubriste toda la región y usaste traslación, rotación y reflexión.":"Falta cumplir algún requisito: 25 casillas, al menos una rotación, una reflexión, una copia sin cambio y una explicación breve.";if(ok){markDone(5);render()}}}function wire5BuilderOnly(){const svg=document.getElementById("builderBoard")?.querySelector("svg");if(svg)svg.addEventListener("click",e=>{const hit=e.target.closest("[data-key]");if(!hit)return;const k=hit.dataset.key;if(eraseMode)delete state.builder.cells[k];else state.builder.cells[k]=state.builder.op;save();document.getElementById("builderBoard").innerHTML="";drawBuilder();wire5BuilderOnly()})}
function wire6(){document.getElementById("finish6").onclick=()=>{const ok1=checkMC("s6a","b"),ok2=checkMC("s6b","b");["exit1","exit2","exit3"].forEach(id=>state.answers[id]=document.getElementById(id).value.trim());save();const textok=["exit1","exit2","exit3"].every(id=>state.answers[id].length>=20),fb=document.getElementById("fb_finish");if(ok1&&ok2&&textok){markDone(6);fb.className="feedback ok";fb.textContent="Actividad completada. Puedes abrir tu informe.";setTimeout(render,500)}else{fb.className="feedback bad";fb.textContent="Revisa las dos preguntas y desarrolla un poco más tus tres respuestas."}}}
function report(){const c=builderCounts(),attempts=Object.values(state.attempts).reduce((a,b)=>a+b,0);main.innerHTML=`<div class="report"><div class="stageHead"><div class="stageNum">✓</div><div><h1>Informe de actividad</h1><p>Teselados mediante transformaciones isométricas</p></div></div><div class="grid2" style="margin-top:15px"><div class="card"><h2>${esc(state.name)}</h2><p><b>Curso:</b> ${esc(state.course)}</p><p><b>Tiempo registrado:</b> ${fmt(state.elapsed)}</p><p><b>Intentos:</b> ${attempts}</p></div><div class="card"><h2>Mosaico final</h2><p>Casillas: <b>${c.count}/25</b></p><p>Copias con rotación: <b>${c.rot}</b></p><p>Copias con reflexión: <b>${c.ref}</b></p><p>Copias sin cambio de orientación: <b>${c.id}</b></p></div></div><div class="card" style="margin-top:15px"><h3>Explicación del diseño</h3><p>${esc(state.answers.designExplain||"")}</p><h3>Ticket de salida</h3><p><b>¿Qué es un teselado válido?</b><br>${esc(state.answers.exit1||"")}</p><p><b>Composición utilizada:</b><br>${esc(state.answers.exit2||"")}</p><p><b>Por qué no se deforma:</b><br>${esc(state.answers.exit3||"")}</p></div><div class="controls noPrint"><button class="primary" onclick="window.print()">Imprimir / Guardar PDF</button><button id="backActivity">Volver</button></div></div>`;document.getElementById("backActivity").onclick=render}
document.getElementById("teacherBtn").onclick=()=>document.getElementById("teacherPanel").classList.remove("hidden");document.getElementById("teacherLoginBtn").onclick=()=>{if(document.getElementById("teacherPass").value==="Stik"){state.teacher=true;save();document.getElementById("teacherLogin").classList.add("hidden");document.getElementById("teacherTools").classList.remove("hidden");render()}else alert("Contraseña incorrecta.")};document.getElementById("teacherClose").onclick=()=>document.getElementById("teacherPanel").classList.add("hidden");document.getElementById("teacherGo").onclick=()=>{state.stage=Number(document.getElementById("teacherStage").value);save();render();document.getElementById("teacherPanel").classList.add("hidden")};document.getElementById("teacherComplete").onclick=()=>{markDone(state.stage);render()};document.getElementById("teacherReset").onclick=()=>{if(confirm("¿Reiniciar todo el progreso?")){localStorage.removeItem(KEY);location.reload()}};document.getElementById("teacherStage").innerHTML=STAGES.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join("");if(state.teacher){document.getElementById("teacherLogin").classList.add("hidden");document.getElementById("teacherTools").classList.remove("hidden")}startScreen();
