function renderSection(){if(wizard)return renderWizard();if(section==='home')return renderHome();if(section==='teacher')return renderTeacher();if(!current)return renderHome();if(section==='idea')return renderIdea();if(section==='board')return renderBoard();if(section==='cards')return renderCards();if(section==='components')return renderComponents();if(section==='rules')return renderRules();if(section==='play')return renderPlay();if(section==='mission')return renderMission();if(section==='evaluation')return renderEvaluation();if(section==='export')return renderExport();return renderHome()}
function renderHome(){const items=[...projects].sort((a,b)=>String(b.updatedAt).localeCompare(a.updatedAt));return `<div class="hero"><div><div style="font-size:.77rem;letter-spacing:.13em;font-weight:800">BIENVENIDOS AL LABORATORIO CREATIVO</div><h1>¡Tus ideas pueden convertirse<br>en grandes juegos!</h1><p>Diseña tableros, inventa cartas, crea reglas, prueba y comparte tus juegos.</p><div class="row" style="margin-top:18px">${button('new-project','＋ Crear mi juego','btn primary')}${button('import','↑ Importar un juego','btn')}</div></div><span class="art" aria-hidden="true">🎲🧩</span></div><div class="grid four" style="margin:18px 0"><div class="stat"><b>${items.length}</b><span class="muted small">Juegos disponibles</span></div><div class="stat"><b>${items.filter(p=>progress(p)>=80).length}</b><span class="muted small">Juegos avanzados</span></div><div class="stat"><b>5</b><span class="muted small">Misiones semanales</span></div><div class="stat"><b>100</b><span class="muted small">Casillas por plantilla</span></div></div><div class="section-head"><div><h2>Mis juegos</h2><p>Selecciona un proyecto para continuar. Los ejemplos se pueden editar y duplicar.</p></div>${button('new-project','＋ Proyecto nuevo','btn primary')}</div>${items.length?`<div class="grid three projects-grid">${items.map(p=>`<article class="card project-card"><div class="project-cover">${boardSvg({...p.board,grid:false},{showGrid:false})}</div><div class="project-details"><h3>${E(p.name)}</h3><p class="muted small">${E(p.theme)} · ${E(p.type)} · ${date(p.updatedAt)}</p><div style="margin:13px 0">${advance(p)}</div><div class="button-set">${button('open-project','Abrir','btn primary small',`data-pid="${p.id}"`)}${button('rename-project','✎','btn small',`data-pid="${p.id}" title="Cambiar nombre"`)}${button('duplicate-project','⧉','btn small',`data-pid="${p.id}" title="Duplicar"`)}${button('delete-project','🗑','btn small danger',`data-pid="${p.id}" title="Eliminar"`)}</div></div></article>`).join('')}</div>`:`<div class="empty"><span class="big">🎲</span><h3>Aún no hay juegos</h3><p>Comienza creando el primer proyecto o importa un archivo.</p></div>`}<div class="note" style="margin-top:20px">💡 Los proyectos se guardan automáticamente en este navegador. Para llevar tu trabajo a otro computador o conservar un respaldo, exporta el archivo JSON desde el menú superior.</div>`}
function renderWizard(){let w=wizard,step=w.step,body='';if(step===0)body=`<h2>¿Qué tipo de juego quieres crear?</h2><p class="muted">Selecciona una idea para comenzar. Podrás modificarla después.</p><div class="choice-grid" style="margin-top:18px">${categoryOptions.map((x,i)=>`<button class="choice ${w.type===x?'selected':''}" data-wizard-choice="type" data-value="${E(x)}"><span class="sym">${categoryIcons[i]}</span>${E(x)}</button>`).join('')}</div>`;
else if(step===1)body=`<h2>¿En qué mundo sucederá?</h2><p class="muted">Selecciona una temática y el nombre de tu juego.</p><div class="choice-grid" style="margin:18px 0">${themes.map((x,i)=>`<button class="choice ${w.theme===x?'selected':''}" data-wizard-choice="theme" data-value="${E(x)}"><span class="sym">${['🧙','🚀','🌳','⚽','🏛️','🔬','🧮','🔍','🗺️','🎨'][i]}</span>${E(x)}</button>`).join('')}</div>${htmlField('Nombre de tu juego','wizard-name',w.name)}`;
else if(step===2)body=`<h2>¿Qué deben lograr los jugadores?</h2><p class="muted">Un buen juego necesita una misión clara y un objetivo concreto.</p><div class="grid two" style="margin:18px 0">${['Llegar primero a la meta','Reunir cinco objetos','Resolver una misión','Conseguir más puntos','Cooperar para ganar','Superar desafíos'].map(x=>`<button class="choice ${w.goal===x?'selected':''}" data-wizard-choice="goal" data-value="${E(x)}">🎯 ${E(x)}</button>`).join('')}</div>${htmlField('Mi objetivo principal','wizard-goal',w.goal,'textarea','Ej.: completar una misión reuniendo tres llaves.')}`;
else if(step===3)body=`<h2>Organiza tu juego</h2><p class="muted">Elige sus características básicas.</p><div class="grid two" style="margin-top:18px">${htmlField('Jugadores mínimos','wizard-minPlayers',w.minPlayers,'number','','min="1" max="8"')}${htmlField('Jugadores máximos','wizard-maxPlayers',w.maxPlayers,'number','','min="1" max="8"')}${htmlField('Duración en minutos','wizard-duration',w.duration,'number','','min="5" max="180"')}${selection('Dificultad','wizard-difficulty',['Fácil','Media','Difícil'],w.difficulty)}</div>${htmlField('Materiales','wizard-materials',w.materials,'textarea')}`;
else body=`<h2>Elige tu tablero</h2><p class="muted">Resumen de tu propuesta. Puedes modificarlo todo desde el editor.</p><div class="grid two" style="margin:17px 0"><div class="note"><b>${E(w.name)}</b><p>Tipo: ${E(w.type)}<br>Temática: ${E(w.theme)}<br>Objetivo: ${E(w.goal)}<br>Personas: ${E(w.minPlayers)}–${E(w.maxPlayers)}</p></div>${selection('Plantilla de tablero','wizard-template',templates.map(([v,t])=>[v,t]),w.template)}</div>${htmlField('Número de casillas (10–100)','wizard-count',w.count,'number','','min="10" max="100"')}`;
return `<div class="wizard-wrap">${head('Crea tu juego','Cinco pasos para transformar tu idea en un proyecto completo.') }<div class="card"><div class="row" style="justify-content:space-between"><span class="eyebrow">Paso ${step+1} de 5</span>${button('cancel-wizard','Cancelar','btn ghost small')}</div><div class="steps">${[0,1,2,3,4].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><div class="col" style="gap:13px">${body}</div><div class="row" style="justify-content:space-between;margin-top:25px">${step?button('wizard-prev','← Volver','btn'):'<span></span>'}${button(step===4?'wizard-create':'wizard-next',step===4?'🎉 Crear mi juego':'Continuar →','btn primary')}</div></div></div>`}
function renderIdea(){let p=current;return `${head('Mi idea','Planifica el propósito, las mecánicas y el equipo de tu juego.',button('go-mission','🎯 Ver mi misión','btn'))}${prefs.guided?'<div class="guide-callout" style="margin-bottom:15px">🧭 <b>Modo guiado:</b> Primero escribe el objetivo: ¿qué deben lograr las personas para ganar? Luego completa el resto.</div>':''}<div class="grid two"><div class="card col"><h2>💡 Identidad del juego</h2>${f('Nombre del juego','name',p.name)}${f('Descripción / historia','description',p.description,'textarea')}${s('Tipo de juego','type',categoryOptions,p.type)}${s('Temática','theme',themes,p.theme)}${f('Objetivo principal','goal',p.goal,'textarea','Escribe lo que los jugadores deberán conseguir.')}${f('Edad recomendada','age',p.age)}</div><div class="card col"><h2>🎮 Cómo será la partida</h2><div class="grid two">${f('Mínimo de jugadores','minPlayers',p.minPlayers,'number','','min="1" max="8"')}${f('Máximo de jugadores','maxPlayers',p.maxPlayers,'number','','min="1" max="8"')}${f('Duración (min)','duration',p.duration,'number','','min="1" max="180"')}${s('Dificultad','difficulty',['Fácil','Media','Difícil'],p.difficulty)}</div>${s('Forma de ganar','win',[['goal','Llegar a la meta'],['points','Alcanzar puntos'],['collect','Reunir recursos'],['cooperative','Puntos entre todos'],['manual','Según reglas manuales']],p.win)}${f('Meta: puntos o recursos','target',p.target,'number','Se usa cuando la victoria se basa en puntos o recursos.','min="1" max="999"')}${f('Materiales','materials',p.materials,'textarea')}${button('go-board','🎨 Diseñar el tablero →','btn primary')}</div></div><div class="card" style="margin-top:16px"><h2>🤝 Nuestro equipo de creación</h2><p class="muted" style="margin:6px 0 16px">Trabajo recomendado: entre 2 y 4 integrantes. Los roles pueden rotar.</p><div class="grid two">${f('Nombre del equipo','team.name',p.team.name)}${f('Acuerdos de colaboración','team.agreements',p.team.agreements,'textarea')}</div><div class="grid two" style="margin-top:10px">${p.team.members.map((m,i)=>`<div class="card compact col"><b>Integrante ${i+1}</b>${f('Nombre o inicial','team.members.'+i+'.name',m.name)}${s('Responsabilidad','team.members.'+i+'.role',['Diseñador del tablero','Creador de tarjetas y componentes','Diseñador de reglas','Encargado de pruebas'],m.role)}${button('remove-member','Quitar integrante','btn danger small',`data-index="${i}" ${p.team.members.length<=1?'disabled':''}`)}</div>`).join('')}</div><div class="button-set" style="margin:12px 0">${button('add-member','＋ Agregar integrante','btn small',p.team.members.length>=4?'disabled':'')}</div>${f('Tareas pendientes','team.todos',p.team.todos,'textarea')}</div>`}
function toolButtons(){return [['rect','▭','Rectángulo'],['ellipse','⚪','Óvalo'],['triangle','🔺','Triángulo'],['line','╱','Línea'],['arrow','↗','Flecha'],['text','T','Texto'],['emoji','⭐','Símbolo'],['cell','◈','Casilla'],['image','🖼️','Imagen']].map(([k,s,n])=>button('add-'+k,`<span>${s}</span>${n}`,'btn')).join('')}
function properties(){let p=current,b=p.board,els=b.items.filter(o=>selected.includes(o.id)),o=els[0];if(els.length>1)return `<h3>✏️ ${els.length} elementos</h3><p class="small muted">Puedes moverlos juntos, alinearlos, distribuirlos y eliminarlos.</p><div class="col" style="margin-top:12px">${button('align-left','← Alinear izquierda','btn small')}${button('align-top','↑ Alinear arriba','btn small')}${button('distribute-x','⇿ Distribuir horizontal','btn small')}${button('distribute-y','↕ Distribuir vertical','btn small')}${button('delete-selected','🗑 Eliminar selección','btn danger small')}</div>`;
if(!o)return `<h3>⚙️ Opciones del tablero</h3><div class="prop-group col">${f('Ancho (px)','board.width',b.width,'number','','min="350" max="2200"')}${f('Alto (px)','board.height',b.height,'number','','min="300" max="1600"')}${f('Color de fondo','board.bg',b.bg,'color')}${checkbox('Mostrar cuadrícula','board.grid',b.grid)}${checkbox('Ajustar a la cuadrícula','board.snap',b.snap)}${button('board-orientation','↻ Cambiar orientación','btn small')}</div><p class="small muted">Selecciona un elemento para ver sus propiedades. Ctrl+clic selecciona varios.</p>${button('show-templates','Cambiar plantilla','btn small')}`;
return `<h3>✏️ Propiedades</h3><div class="tag" style="margin-bottom:12px">${E(o.type==='cell'?'Casilla #'+o.seq:o.type)} ${o.locked?'🔒':''}</div><div class="prop-group col">${o.type==='cell'?`${s('Tipo de casilla','object.cellType',cellTypes.map(([a,b])=>[a,b]),o.cellType)}${f('Nombre','object.name',o.name||'')}${f('Instrucción al llegar','object.desc',o.desc||'','textarea')}${f('Valor de acción','object.amount',o.amount||2,'number','Pasos, puntos o recursos según tipo.','min="1" max="99"')}${f('Enlace a casilla (opcional)','object.link',o.link||0,'number','En caso de enlazar con otra casilla.','min="0" max="100"')}`:o.type==='text'||o.type==='rect'?f('Texto','object.text',o.text||''):o.type==='emoji'?f('Símbolo o emoji','object.emoji',o.emoji||'⭐'):''}<div class="grid two">${f('Posición X','object.x',o.x,'number')}${f('Posición Y','object.y',o.y,'number')}${f('Ancho','object.w',o.w,'number','','min="5"')}${f('Alto','object.h',o.h,'number','','min="5"')}</div>${o.type!=='image'&&o.type!=='emoji'&&o.type!=='line'?f('Relleno','object.fill',o.fill,'color'):''}${o.type!=='image'?f('Borde / línea','object.stroke',o.stroke,'color'):''}${o.type==='text'?f('Tamaño letra','object.fontSize',o.fontSize||26,'number'):''}${o.type==='cell'||o.type==='emoji'?f('Icono opcional','object.emoji',o.emoji||''):''}${o.type==='image'?button('upload-image','Cambiar imagen','btn small',`data-target="object"`):''}${checkbox('Bloquear posición','object.locked',o.locked)}</div><div class="button-set">${button('duplicate-selected','⧉ Duplicar','btn small')}${button('front','↑ Delante','btn small')}${button('backward','↓ Atrás','btn small')}${button('delete-selected','🗑 Eliminar','btn danger small')}</div>`}
function renderBoard(){let b=current.board;return `${head('Editor de tableros','Selecciona objetos, arrástralos o cambia sus propiedades. Puedes crear tableros de hasta 100 casillas.',button('show-templates','🎲 Generar tablero','btn primary'))}<div class="editor-layout"><aside class="card editor-tools"><h3>➕ Herramientas</h3><div class="tool-list">${toolButtons()}</div><hr class="divider"><h3>🌟 Biblioteca</h3><select class="control" id="symbol-category" aria-label="Categoría de símbolos" style="margin-bottom:8px"><option value="">Todas las categorías</option>${Object.keys(symbolGroups).map(x=>`<option value="${E(x)}">${E(x)}</option>`).join('')}</select><input class="control" id="symbol-search" placeholder="Buscar símbolo" aria-label="Buscar símbolos" style="margin-bottom:8px"><div class="row" id="symbol-list">${allSymbols.map(x=>button('add-symbol',x.icon,'btn small',`data-symbol="${x.icon}" data-group="${E(x.category)}" title="${E(x.category)}"`)).join('')}</div></aside><div class="board-container"><div class="board-toolbar">${button('undo','↶','btn small',history.length?'':'disabled')}${button('redo','↷','btn small',future.length?'':'disabled')}${button('zoom-out','−','btn square small')}<span class="pill" id="zoomLabel">${Math.round(zoom*100)}%</span>${button('zoom-in','＋','btn square small')}${button('zoom-reset','Ajustar','btn small')}${button('select-all','Seleccionar todo','btn small')}${button('delete-selected','🗑','btn small danger',!selected.length?'disabled':'')}</div><div class="canvas-scroll" id="canvas-scroll">${boardSvg(b,{selection:selected})}</div><div class="board-bottom"><span>${b.items.length} elementos · ${cells(current).length} casillas</span><span>Ctrl+clic para varios · Supr elimina · Flechas mueven</span></div></div><aside class="card property-panel" id="properties">${properties()}</aside></div><div class="note" style="margin-top:14px">🖱️ <b>Editor:</b> arrastra los elementos para moverlos; arrastra el cuadro rosado de la esquina para cambiar su tamaño. Guarda automáticamente y admite deshacer/rehacer. Para mover por teclado: selecciona un objeto y utiliza las flechas.</div>`}
function currentDeck(){if(!current?.decks?.length)return null;let d=current.decks.find(x=>x.id===editDeck)||current.decks[0];editDeck=d.id;return d}
function currentCard(){let d=currentDeck();let c=d?.cards.find(x=>x.id===editCard)||d?.cards[0];editCard=c?.id||null;return c}
function cardPreview(c){if(!c)return `<div class="empty">Elige o crea una tarjeta para verla.</div>`;return `<div class="playing-card" style="background:${E(c.color)}" title="Haz clic para ver el reverso" data-action="flip-preview">${flipCard?`<div class="card-footer">REVERSO</div><div class="back-art">${E(c.icon||'🃏')}</div><h2>${E(c.back||'¡Sorpresa!')}</h2><div class="card-footer">Pulsa para revelar</div>`:`<div class="card-footer">${E(c.type)} · ${E(c.difficulty)}</div><div class="card-sym">${E(c.icon||'🃏')}</div>${safeImage(c.image)?`<img src="${safeImage(c.image)}" alt="Imagen de tarjeta">`:''}<h2>${E(c.title)}</h2><p>${E(c.body)}</p><div class="card-footer">${E(c.category)} · ${Number(c.points)||0} puntos</div>`}</div>`}
function renderCards(){let d=currentDeck(),c=currentCard();return `${head('Creador de tarjetas','Diseña mazos de preguntas, misiones, recompensas y desafíos. Haz clic en la vista previa para girar la tarjeta.',button('add-deck','＋ Nuevo mazo','btn primary'))}<div class="deck-list">${current.decks.map(x=>button('choose-deck',`🃏 ${E(x.name)} (${x.cards.length})`,`btn small ${d?.id===x.id?'active':''}`,`data-did="${x.id}"`)).join('')}${d?button('rename-deck','✎ Renombrar','btn small')+button('delete-deck','🗑 Mazo','btn danger small'):''}</div>${!d?'<div class="empty">Agrega un mazo para comenzar.</div>':`<div class="cards-layout"><aside class="card compact"><div class="row" style="justify-content:space-between;margin-bottom:11px"><h3>Tarjetas</h3>${button('add-card','＋ Nueva','btn primary small')}</div><div class="card-list">${d.cards.map(x=>button('choose-card',`${E(x.icon)} ${E(x.title)}`,`btn small ${c?.id===x.id?'active':''}`,`data-cid="${x.id}"`)).join('')||'<span class="muted small">El mazo está vacío.</span>'}</div><hr class="divider"><div class="col">${button('import-cards','↑ Importar tarjetas JSON','btn small')}${button('duplicate-card','⧉ Duplicar tarjeta','btn small',!c?'disabled':'')}${button('delete-card','🗑 Eliminar tarjeta','btn danger small',!c?'disabled':'')}</div></aside><div class="card col"><h3>✏️ Editar tarjeta</h3>${c?`${f('Título','card.title',c.title)}${s('Tipo','card.type',cardTypes,c.type)}${f('Texto principal','card.body',c.body,'textarea')}${f('Respuesta opcional','card.answer',c.answer)}${f('Explicación / instrucción','card.explain',c.explain,'textarea')}<div class="grid two">${f('Categoría','card.category',c.category)}${s('Dificultad','card.difficulty',['Fácil','Media','Difícil'],c.difficulty)}${f('Puntos','card.points',c.points,'number')}${f('Color','card.color',c.color,'color')}</div>${f('Símbolo / emoji','card.icon',c.icon)}${f('Texto del reverso','card.back',c.back)}<div class="button-set">${button('upload-image','🖼 Añadir imagen','btn small',`data-target="card"`)}${c.image?button('remove-card-image','Quitar imagen','btn danger small'):''}</div>`:'<p class="muted">Selecciona o crea una tarjeta para editarla.</p>'}</div><div class="col">${cardPreview(c)}${button('test-card','🎲 Extraer tarjeta aleatoria','btn small')}${button('shuffle-deck','🔀 Barajar mazo','btn small')}${button('move-card','↪ Cambiar de mazo','btn small',!c?'disabled':'')}</div></div>`}`}
function renderComponents(){let p=current;let tok=p.tokens.find(x=>x.id===editToken)||p.tokens[0];editToken=tok?.id||null;let char=p.characters.find(x=>x.id===editCharacter)||p.characters[0];editCharacter=char?.id||null;return `${head('Fichas y componentes','Crea personajes, personaliza fichas y configura los objetos de azar de tu juego.')}<div class="grid two"><div class="card col"><div class="row" style="justify-content:space-between"><h2>🔵 Fichas de jugadores</h2>${button('add-token','＋ Ficha','btn primary small')}</div><div class="button-set">${p.tokens.map(t=>button('choose-token',`${E(t.icon)} ${E(t.name)}`,`btn small ${t.id===editToken?'active':''}`,`data-tid="${t.id}"`)).join('')}</div>${tok?`${f('Nombre','token.name',tok.name)}<div class="grid two">${f('Color','token.color',tok.color,'color')}${s('Forma','token.shape',['circle','square','diamond'],tok.shape)}</div>${f('Emoji / iniciales','token.icon',tok.icon)}<div class="row">${button('upload-image','🖼 Imagen de ficha','btn small',`data-target="token"`)}${tok.image?button('remove-token-image','Quitar imagen','btn danger small'):''}</div><div class="row">${button('delete-token','🗑 Quitar ficha','btn danger small',p.tokens.length<2?'disabled':'')}<span class="pill">Vista previa: <span style="color:${E(tok.color)}">${E(tok.icon)}</span></span></div>`:''}</div><div class="card col"><div class="row" style="justify-content:space-between"><h2>🦸 Personajes</h2>${button('add-character','＋ Personaje','btn primary small')}</div><div class="button-set">${p.characters.map(t=>button('choose-character',`${E(t.avatar)} ${E(t.name)}`,`btn small ${t.id===editCharacter?'active':''}`,`data-chid="${t.id}"`)).join('')}</div>${char?`${f('Nombre','character.name',char.name)}${f('Descripción','character.description',char.description,'textarea')}${f('Avatar (emoji)','character.avatar',char.avatar)}${f('Habilidades','character.skills',char.skills,'textarea')}${f('Puntos iniciales','character.points',char.points,'number')}${button('delete-character','🗑 Quitar personaje','btn danger small')}`:'<p class="muted">Crea personajes con habilidades e historias especiales.</p>'}</div><div class="card col"><h2>🎲 Dados y moneda</h2>${s('Número de caras del dado','accessories.die',[[4,'D4 · 4 caras'],[6,'D6 · 6 caras'],[8,'D8 · 8 caras'],[10,'D10 · 10 caras'],[12,'D12 · 12 caras'],[20,'D20 · 20 caras']],p.accessories.die)}<div class="row">${button('component-dice','🎲 Lanzar dado','btn primary')}${button('component-coin','🪙 Lanzar moneda','btn')}${button('component-wheel','🎡 Girar ruleta','btn')}</div><div class="note" id="component-result">Prueba los elementos antes de comenzar a jugar.</div></div><div class="card col"><h2>🎡 Ruleta y recursos</h2>${f('Opciones de ruleta (una por línea)','accessories.wheel',p.accessories.wheel.join('\n'),'textarea','Puedes añadir o eliminar segmentos libremente.')}${f('Recursos coleccionables (uno por línea)','accessories.resources',p.accessories.resources.join('\n'),'textarea','El primero se utiliza en partidas con victoria por recolección.')}${button('go-play','▶ Probar componentes en una partida','btn primary')}</div></div>`}
function renderRules(){let p=current;return `${head('Constructor de reglas','Redacta instrucciones claras y crea reglas automáticas simples con bloques CUANDO / SI / ENTONCES.')}<div class="grid two"><div class="card col"><h2>📜 Reglamento paso a paso</h2><p class="muted small">Completa estas 14 preguntas para que cualquier persona pueda aprender a jugar.</p>${RULES.map(([key,q,h],i)=>`<details ${i<2?'open':''}><summary>${i+1}. ${E(q)} ${p.rules[key]?.trim()?'✅':''}</summary><div style="margin-top:12px">${f('Tu respuesta','rules.'+key,p.rules[key]||'','textarea',h)}</div></details>`).join('')}</div><div class="col"><div class="card col"><h2>⚡ Reglas automatizadas</h2><p class="small muted">El motor ejecuta las reglas compatibles durante la partida. No interpreta las reglas escritas en texto libre.</p>${p.blocks.map((b,i)=>`<div class="action-card"><div class="small"><b>CUANDO</b> ${E(eventName(b.event))}<br><b>SI</b> ${E(conditionName(b.condition))}<br><b>ENTONCES</b> ${E(actionName(b.action))} ${E(b.value||'')}</div><div class="row">${button('edit-block','✎','btn small',`data-bid="${b.id}"`)}${button('delete-block','×','btn danger small',`data-bid="${b.id}"`)}</div></div>`).join('')||'<p class="muted small">Aún no hay reglas adicionales.</p>'}${button('add-block','＋ Añadir regla automática','btn primary')}</div><div class="card col"><h2>🧩 Acciones incorporadas</h2><p>Las casillas especiales permiten avanzar, retroceder, perder turnos, sumar o restar puntos, extraer tarjetas y mostrar desafíos.</p><div class="note">✅ Automáticas: dado, turnos, posiciones, puntos, movimientos, extracción de tarjetas y condiciones de victoria configuradas.<br><br>✋ Manuales: movimientos libres de estrategia, resolución de desafíos, negociación y reglas escritas libremente.</div>${button('go-play','▶ Probar el reglamento','btn primary')}</div></div></div>`}
const eventName=k=>({land:'Cae en una casilla',roll:'Lanza el dado',draw:'Extrae una carta',turn:'Comienza un turno'})[k]||k;
const conditionName=k=>({always:'Siempre',special:'Casilla especial',six:'Resultado 6',goal:'Casilla meta',normal:'Casilla normal'})[k]||k;
const actionName=k=>({points:'Gana puntos',losePoints:'Pierde puntos',move:'Avanza casillas',back:'Retrocede casillas',skip:'Pierde turno',draw:'Saca tarjeta',resource:'Gana recurso',win:'Finaliza con victoria'})[k]||k;
function renderPlay(){let p=current,cs=cells(p),live=!!play;if(!live)return `${head('¡Juega tu creación!','Prueba en el mismo dispositivo. Para tableros de recorrido, el dado mueve fichas automáticamente; en tableros libres se mueven manualmente.')}<div class="grid two"><div class="card col"><h2>🎲 Preparar la partida</h2><div class="note">Este modo permite de 1 a 8 jugadores locales. Puedes controlar tú mismo varios participantes y comprobar si el juego es justo y entretenido.</div>${htmlField('Número de jugadores','start-players',cap(p.maxPlayers,1,8),'number','','min="1" max="8"')}<div id="play-names" class="col"></div>${button('start-game','▶ Comenzar partida','btn primary')}</div><div class="card col"><h2>📝 Antes de jugar</h2><p><b>Objetivo:</b> ${E(p.goal)}</p><p><b>Victoria:</b> ${E(winText(p))}</p><p><b>Dados:</b> D${E(p.accessories.die)}</p><p><b>Casillas:</b> ${cs.length}</p>${button('go-rules','Revisar el reglamento','btn')}</div></div>`;
let cur=play.players[play.turn];return `${head('¡Juega tu creación!','Durante la prueba puedes identificar errores, modificar puntos y registrar observaciones.',button('restart-game','↻ Reiniciar partida','btn'))}<div class="play-layout"><div class="board-container"><div class="play-canvas" id="play-canvas">${boardSvg(p.board,{gamePlayers:play.players,showGrid:false,playMode:true})}</div><div class="board-bottom"><span>${E(p.board.template==='strategy'||p.board.template==='territory'||p.board.template==='empty'?'Movimiento manual: selecciona una casilla del tablero.':'Las fichas avanzan con el dado.')}</span><span>Turno ${play.turnCount}</span></div></div><aside class="col"><div class="card col"><h3>${play.winner?'🏆 Partida finalizada':'🎲 Turno de '+E(cur.name)}</h3><div class="note">${E(play.winner||play.lastMessage||'Lanza el dado para avanzar.')}</div><div class="row">${button('roll-dice',`🎲 Lanzar D${E(p.accessories.die)}`,'btn primary',play.winner?'disabled':'')}${button('next-turn','Turno siguiente →','btn',play.winner?'disabled':'')}</div><div class="row">${button('spin-wheel','🎡 Ruleta','btn small',play.winner?'disabled':'')}${button('flip-coin','🪙 Moneda','btn small',play.winner?'disabled':'')}${button('draw-game-card','🃏 Carta','btn small',play.winner?'disabled':'')}</div><div class="row"><label class="small muted">Puntos:</label>${button('manual-point-plus','＋','btn small',play.winner?'disabled':'')}${button('manual-point-minus','−','btn small',play.winner?'disabled':'')}<label class="small muted">Recurso:</label>${button('manual-resource-plus','＋','btn small',play.winner?'disabled':'')}${button('manual-resource-minus','−','btn small',play.winner?'disabled':'')}</div><div class="row">${button('manual-move-minus','← 1','btn small',play.winner?'disabled':'')}${button('manual-move-plus','1 →','btn small',play.winner?'disabled':'')}${button('manual-win','🏁 Finalizar','btn small',play.winner?'disabled':'')}</div></div><div class="card col"><h3>👥 Marcador</h3><div class="players-list">${play.players.map((x,i)=>`<div class="player ${i===play.turn?'turn':''}"><div class="row"><span class="token" style="background:${E(x.color)}">${E(x.icon)}</span><div><b>${E(x.name)}</b><div class="small muted">Casilla ${x.pos||'inicio'} · ⭐ ${x.points} · 💎 ${x.resources}</div></div></div>${i===play.turn?'🎯':''}</div>`).join('')}</div></div><div class="card col"><h3>📋 Registro de partida</h3><div class="log">${play.log.slice(-16).reverse().map(x=>`<div>${E(x)}</div>`).join('')||'<p>Sin acciones todavía.</p>'}</div>${button('record-test','📝 Registrar prueba y mejoras','btn primary small')}</div></aside></div>`}
function winText(p){return {goal:'Llegar a la meta',points:`Llegar a ${p.target} puntos`,collect:`Reunir ${p.target} recursos`,cooperative:`Conseguir ${p.target} puntos entre todos`,manual:'Finalización manual según las reglas'}[p.win]}
function renderMission(){let p=current,total=p.mission.filter(m=>m.done).length;return `${head('Mi misión de creación','Cinco semanas de 45 minutos para imaginar, construir, probar y presentar tu juego.')}<div class="card" style="margin-bottom:17px"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Tu ruta de aprendizaje</div><h2>${total}/5 etapas completadas</h2></div><span style="font-size:2rem">🎯</span></div><div class="meter" style="margin-top:14px;height:12px"><span style="width:${total*20}%"></span></div></div><div class="week-list">${weekData.map((w,i)=>{let m=p.mission[i];return `<div class="card week-card ${m.done?'completed':''}"><div class="week-head"><div><span class="eyebrow">Semana ${i+1} · 45 minutos</span><h2>${E(w.title)}</h2><p class="muted">${E(w.goal)}</p></div><span class="pill">${m.checks.filter(Boolean).length}/${w.tasks.length} tareas</span></div><div class="grid two" style="margin-top:15px"><div class="col">${w.tasks.map((t,j)=>`<label class="checkrow"><input type="checkbox" data-mission="${i}" data-check="${j}" ${m.checks[j]?'checked':''}>${E(t)}</label>`).join('')}</div><div class="col"><div class="note"><b>Producto esperado</b><br>${E(w.evidence)}</div><div class="button-set">${button('navigate-week','Abrir herramienta →','btn small',`data-week="${i}"`)}${button('complete-week',m.done?'✓ Etapa completada':'Marcar como completada',`btn ${m.done?'success':'primary'} small`,`data-week="${i}"`)}</div></div></div></div>`}).join('')}</div>`}
function renderEvaluation(){let r=current.review;let rated=r.criteria.filter(x=>x.score>0),mean=rated.length?(rated.reduce((a,c)=>a+Number(c.score),0)/rated.length).toFixed(1):'—';return `${head('Evaluación y reflexión','Revisa la calidad del juego e identifica fortalezas y oportunidades para mejorar. No se asigna ninguna nota automáticamente.')}<div class="grid three" style="margin-bottom:16px"><div class="stat"><b>${rated.length}/8</b><span class="muted small">Criterios evaluados</span></div><div class="stat"><b>${mean}</b><span class="muted small">Promedio descriptivo (1 a 4)</span></div><div class="stat"><b>${r.tests.length}</b><span class="muted small">Pruebas registradas</span></div></div><div class="card"><h2>⭐ Rúbrica editable</h2><p class="muted small" style="margin:7px 0 14px">Puedes modificar cada criterio y seleccionar: Excelente (4), Logrado (3), En desarrollo (2) o Inicial (1).</p><div class="table-scroll"><table class="rubric-table"><thead><tr><th>Criterio (editable)</th><th>Nivel</th></tr></thead><tbody>${r.criteria.map((c,i)=>`<tr><td><input class="control" aria-label="Criterio ${i+1}" data-rubric-name="${i}" value="${E(c.name)}"></td><td><select data-rubric-score="${i}">${scoreOptions.map(([k,t])=>`<option value="${k}" ${Number(c.score)===Number(k)?'selected':''}>${t}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:13px"><b>Descriptores de desempeño:</b> Excelente: fundamenta y aplica con autonomía; Logrado: cumple lo esperado; En desarrollo: necesita ajustes; Inicial: necesita mayor acompañamiento.</div></div><div class="grid two" style="margin-top:16px"><div class="card col"><h2>✍️ Autoevaluación</h2>${f('¿Qué hicimos bien?','review.strengths',r.strengths,'textarea')}${f('¿Qué podemos mejorar?','review.improvements',r.improvements,'textarea')}${f('Comentarios del equipo','review.notes',r.notes,'textarea')}</div><div class="card col"><div class="row" style="justify-content:space-between"><h2>🧪 Registro de pruebas</h2>${button('record-test','＋ Registrar prueba','btn primary small')}</div>${r.tests.length?r.tests.map((t,i)=>`<div class="action-card"><div><b>${date(t.date)}</b><div class="small">${E(t.finding)}</div><div class="muted small">Mejora: ${E(t.improvement)}</div></div>${button('remove-test','×','btn danger small',`data-index="${i}"`)}</div>`).join(''):'<p class="muted small">Juega una partida y registra qué funcionó y qué conviene mejorar.</p>'}</div></div>`}
function renderExport(){return `${head('Exportar e imprimir','Guarda el proyecto completo, genera imágenes del tablero y prepara materiales recortables.')}<div class="grid three"><div class="card col"><h2>💾 Respaldo del proyecto</h2><p>El archivo JSON contiene las reglas, objetos, tarjetas y componentes para continuar en otro dispositivo.</p>${button('export-json','↓ Descargar proyecto JSON','btn primary')}${button('import','↑ Importar proyecto JSON','btn')}</div><div class="card col"><h2>🖼️ Imágenes del tablero</h2><p>Exporta tu diseño con formas, colores, números, símbolos y las imágenes que agregaste.</p>${button('export-svg','↓ Descargar SVG','btn primary')}${button('export-png','↓ Descargar PNG','btn')}</div><div class="card col"><h2>🖨️ Material imprimible</h2><p>Tablero, tarjetas, fichas, reglamento y dossier con todos los elementos del juego.</p>${button('open-print','🖨 Preparar impresión','btn primary')}</div></div><div class="card" style="margin-top:16px"><h2>📤 Recomendaciones antes de compartir</h2><div class="grid two" style="margin-top:14px"><div class="note">✅ Comprueba que las casillas están ordenadas, que el tablero sea legible y que cada tarjeta tenga instrucciones claras.</div><div class="note">📄 Puedes elegir <b>Imprimir → Guardar como PDF</b> en Chrome o Edge. Para tableros grandes, activa la distribución por páginas.</div></div></div>`}
function renderTeacher(){let p=current;return `${head('Guía docente','Orientaciones para acompañar el trabajo creativo de estudiantes de 7.º y 8.º básico.')}<div class="grid two"><div class="card col"><h2>🗓️ Secuencia de cinco clases</h2>${weekData.map((w,i)=>`<div><b>${i+1}. ${E(w.title)} (45 min)</b><p class="muted small">${E(w.goal)} Producto: ${E(w.evidence)}</p></div>`).join('')}${button('print-planning','🖨 Imprimir ficha de planificación','btn primary')}</div><div class="card col"><h2>🎯 Objetivos y habilidades</h2><p>Esta propuesta favorece la creatividad, resolución de problemas, planificación, comunicación oral y escrita, trabajo colaborativo, perseverancia y revisión de prototipos. También permite integrar contenidos curriculares de distintas asignaturas según el juego.</p><div class="note">No se atribuye automáticamente un Objetivo de Aprendizaje curricular específico: el equipo docente puede vincular el juego con los OA pertinentes a su planificación.</div><h3>Rúbrica de apoyo</h3><p>Ocho criterios, cuatro niveles descriptivos y autoevaluación. Los resultados se interpretan pedagógicamente y no se convierten automáticamente en calificaciones.</p>${button('go-evaluation','⭐ Ir a rúbrica','btn')}</div><div class="card col"><h2>💬 Retroalimentación sugerida</h2><p>«Tu objetivo se comprende. ¿Qué ocurre si dos personas llegan a la meta al mismo tiempo?»</p><p>«Prueba con un compañero que no haya participado en el diseño y registra las dudas que surjan».</p><p>«¿La dificultad de tus tarjetas permite que todos tengan una posibilidad razonable de participar?»</p><h3>Apoyos para inclusión</h3><p>Divide las instrucciones en pasos, utiliza ejemplos visuales, ofrece opciones de tablero prediseñado, adapta el tamaño de letra y asigna roles rotativos.</p></div><div class="card col"><h2>📦 Ejemplos editables</h2><p>La plataforma incluye Aventura matemática, Exploradores del espacio y Misión cooperativa.</p>${button('restore-samples','＋ Agregar tres ejemplos','btn primary')}${button('import','↑ Revisar proyecto recibido','btn')}<div class="note">Los archivos JSON se comparten sin conexión y pueden importarse para revisar componentes, avance y autoevaluación. No existe edición simultánea ni un panel remoto de seguimiento.</div></div></div><div class="card" style="margin-top:15px"><h2>⚙️ Accesibilidad y ajustes</h2><div class="row" style="margin-top:12px">${button('toggle-guided',prefs.guided?'✓ Modo guiado':'Activar modo guiado','btn')}${button('toggle-theme',prefs.theme==='dark'?'☀️ Modo claro':'🌙 Modo oscuro','btn')}${button('cycle-font','Aa Tamaño de letra','btn')}${button('toggle-motion',prefs.reduce?'✓ Animaciones reducidas':'Reducir animaciones','btn')}</div></div>`}
// Modals
function renderModal(){if(!modal)return '';let m=modal,body='',title=m.title||'',footer='';
if(m.kind==='templates'){title='Generador de tableros';body=`<p class="muted">Elige la plantilla y el número de casillas. Al generar, se reemplazará el diseño actual del tablero.</p><div class="template-grid" style="margin:14px 0">${templates.map(([v,t,i])=>`<button class="template ${m.template===v?'selected':''}" data-template="${v}"><span>${i}</span>${E(t)}</button>`).join('')}</div>${htmlField('Número de casillas (10–100)','template-count',m.count,'number','','min="10" max="100"')}<div class="warn small" style="margin-top:12px">⚠️ Se sustituirán los objetos actuales. Puedes utilizar Deshacer para recuperar el diseño.</div>`;footer=button('generate-template','Crear tablero','btn primary')}
if(m.kind==='text'){body=htmlField(m.label||'Texto','modal-text',m.value||'');footer=button('accept-text','Guardar','btn primary')}
if(m.kind==='confirm'){body=`<p>${E(m.message)}</p>`;footer=button('confirm-yes','Sí, continuar','btn danger')}
if(m.kind==='block'){let b=m.block;title=m.id?'Editar regla automática':'Nueva regla automática';body=`<div class="col">${selection('CUANDO (evento)','block-event',[['land','Cae en casilla'],['roll','Lanza dado'],['draw','Extrae tarjeta'],['turn','Comienza turno']],b.event)}${selection('SI (condición)','block-condition',[['always','Siempre'],['special','Casilla especial'],['six','Resultado 6'],['goal','Casilla meta'],['normal','Casilla normal']],b.condition)}${selection('ENTONCES (acción)','block-action',[['points','Gana puntos'],['losePoints','Pierde puntos'],['move','Avanza pasos'],['back','Retrocede pasos'],['skip','Pierde turno'],['draw','Saca tarjeta'],['resource','Gana recurso'],['win','Finaliza con victoria']],b.action)}${htmlField('Cantidad (si corresponde)','block-value',b.value,'number','','min="1" max="99"')}<div class="note small">Solo se ejecutarán los eventos y acciones configurados aquí; el reglamento libre requiere intervención humana.</div></div>`;footer=button('save-block','Guardar regla','btn primary')}
if(m.kind==='branch'){title='🧭 ¡Hay dos caminos!';body=`<p>Desde la casilla <b>${m.from}</b> puedes continuar el recorrido normal o tomar el atajo hasta la casilla <b>${m.to}</b>.</p><p class="muted small">El equipo decide qué camino seguir.</p>`;footer=button('branch-normal','Seguir el camino','btn')+button('branch-shortcut','Tomar el atajo ↗','btn primary')}
if(m.kind==='move-card'){title='Mover tarjeta a otro mazo';body=selection('Mazo de destino','move-destination',current.decks.filter(x=>x.id!==editDeck).map(x=>[x.id,x.name]),'');footer=button('move-card-confirm','Mover tarjeta','btn primary')}

if(x.matches('#print-kind,#print-paper,#print-orientation,#print-tiles')&&modal){modal.printKind=$('#print-kind')?.value||modal.printKind;modal.paper=$('#print-paper')?.value||modal.paper;modal.orientation=$('#print-orientation')?.value||modal.orientation;modal.tiles=Number($('#print-tiles')?.value)||1;$('#overlay').innerHTML=renderModal();return}
});
function filterSymbols(){let text=($('#symbol-search')?.value||'').toLowerCase(),cat=$('#symbol-category')?.value||'';$$('#symbol-list button').forEach(x=>x.style.display=(!cat||x.dataset.group===cat)&&(!text||x.dataset.group.toLowerCase().includes(text)||x.dataset.symbol.includes(text))?'':'none')}document.addEventListener('input',e=>{if(e.target.id==='symbol-search')filterSymbols()});document.addEventListener('change',e=>{if(e.target.id==='symbol-category')filterSymbols()});
$('#importfile').addEventListener('change',async e=>{try{await readJSON(e.target.files?.[0])}catch(err){toast('No se pudo importar: '+err.message,6000)}e.target.value=''});
$('#imagefile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)||file.size>1.4e6){toast('Usa una imagen PNG, JPG, WEBP o GIF de hasta 1,4 MB.');return}let data=await new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});remember();if(imageTarget==='card'&&currentCard())currentCard().image=data;else if(imageTarget==='token'){let t=current.tokens.find(x=>x.id===editToken);if(t)t.image=data}else if(imageTarget==='object'){let obj=current.board.items.find(x=>x.id===selected[0]);if(obj)obj.image=data}touch();draw();toast('Imagen añadida correctamente.')});
document.addEventListener('keydown',e=>{let target=e.target;if(target.matches('input,textarea,select')||target.isContentEditable)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();stepUndo(e.shiftKey);return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();stepUndo(true);return}if(section!=='board'||!current||modal)return;if((e.key==='Delete'||e.key==='Backspace')&&selected.length){e.preventDefault();deleteSelection();return}let shifts={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(shifts[e.key]&&selected.length){e.preventDefault();remember();let [dx,dy]=shifts[e.key],s=e.shiftKey?10:1;current.board.items.filter(x=>selected.includes(x.id)&&!x.locked).forEach(o=>{o.x+=dx*s;o.y+=dy*s});touch();draw()}});
function pointerPoint(ev,svg){let mat=svg.getScreenCTM();if(!mat)return {x:0,y:0};let pt=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(mat.inverse());return{x:pt.x,y:pt.y}}
document.addEventListener('pointerdown',e=>{if(e.button!==0||!current||modal)return;let svg=e.target.closest('svg.board-svg'),g=e.target.closest('[data-oid]');if(!svg||!g)return;
if(section==='play'&&play){if(['strategy','territory','empty'].includes(current.board.template)&&!play.winner){let o=current.board.items.find(x=>x.id===g.dataset.oid);if(!o)return;let pl=play.players[play.turn];pl.x=o.x+o.w/2;pl.y=o.y+o.h/2;pl.pos=o.seq||0;addLog(`${pl.name} se movió manualmente a ${o.name||o.text||o.type}.`);if(o.type==='cell')onLand(pl,o);draw()}return}
if(section!=='board')return;let oid=g.dataset.oid,o=current.board.items.find(x=>x.id===oid);if(!o)return;
if(e.shiftKey||e.ctrlKey||e.metaKey){selected=selected.includes(oid)?selected.filter(x=>x!==oid):[...selected,oid];draw();return}
if(!selected.includes(oid))selected=[oid];
let pt=pointerPoint(e,svg),resize=!!e.target.closest('[data-resize]');drag={pointerId:e.pointerId,svg,point:pt,mode:resize?'resize':'move',ids:[...selected],original:current.board.items.filter(x=>selected.includes(x.id)).map(x=>({id:x.id,x:x.x,y:x.y,w:x.w,h:x.h})),before:clone(current),moved:false};
if(o.locked){drag=null;draw();return}svg.setPointerCapture?.(e.pointerId);e.preventDefault();$$('[data-oid]',svg).forEach(el=>el.classList.toggle('is-selected',selected.includes(el.dataset.oid)));let prop=$('#properties');if(prop)prop.innerHTML=properties()});
document.addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return;let svg=drag.svg,p=pointerPoint(e,svg),dx=p.x-drag.point.x,dy=p.y-drag.point.y;if(Math.abs(dx)+Math.abs(dy)<2&&!drag.moved)return;drag.moved=true;let snap=current.board.snap?25:1;for(let st of drag.original){let o=current.board.items.find(x=>x.id===st.id);if(!o||o.locked)continue;if(drag.mode==='move'){o.x=Math.round((st.x+dx)/snap)*snap;o.y=Math.round((st.y+dy)/snap)*snap}else{o.w=Math.max(10,Math.round((st.w+dx)/snap)*snap);o.h=Math.max(10,Math.round((st.h+dy)/snap)*snap)}let g=$(`[data-oid="${st.id}"]`,svg);if(!g)continue;if(drag.mode==='move')g.setAttribute('transform',`translate(${o.x} ${o.y})`);else{const oldSelection=g.querySelector('.selection-border');if(oldSelection)oldSelection.setAttribute('width',o.w+6);/* full shape will update when pointer is released */}}
});
document.addEventListener('pointerup',e=>{if(!drag||drag.pointerId!==e.pointerId)return;if(drag.moved){history.push(drag.before);if(history.length>30)history.shift();future=[];touch()}drag=null;draw()});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;draw()}});
async function start(){pref();let available=await openDB();if(available)projects=await getAll();if(!projects.length){projects=demoSamples();if(available)for(let p of projects)await storeProject(p).catch(()=>{});}projects.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));draw();if(!available)toast('Tu navegador impidió guardar localmente. Exporta un JSON para conservar tus juegos.',9500)}
start();
</script></body></html>
