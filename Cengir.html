<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de Rotaciones · 8° básico</title>
<style>
:root{--b:#3867ff;--g:#16a36a;--o:#ff9d3d;--r:#dd526b;--i:#172033;--m:#65728a;--l:#dfe7f3;--bg:#f4f8ff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--i);background:linear-gradient(135deg,#eff5ff,#fbfdff,#eefbf8)}button,input,select,textarea{font:inherit}.hide{display:none!important}
.app{max-width:1260px;margin:auto;padding:14px}.bar{position:sticky;top:0;z-index:9;background:#fffffff2;border:1px solid var(--l);border-radius:17px;padding:11px 14px;box-shadow:0 10px 30px #284a8018}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;margin-right:auto;color:#224ba8}.badge{padding:6px 10px;border-radius:999px;background:#edf3ff;color:#2d55b2;font-weight:800;font-size:13px}.track{height:10px;background:#e7edf7;border-radius:999px;margin-top:9px;overflow:hidden}.prog{height:100%;background:linear-gradient(90deg,var(--b),#24b8c5);width:0;transition:.25s}
.card,.hero,.head,.foot{background:white;border:1px solid var(--l);border-radius:20px;box-shadow:0 12px 34px #284a8018}.hero{max-width:900px;margin:36px auto;padding:30px}.hero h1{font-size:clamp(34px,6vw,60px);margin:8px 0}.hero h2{color:var(--m);font-size:20px}.objective{background:#eef4ff;border-left:6px solid var(--b);padding:15px;border-radius:14px;line-height:1.5}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.form input,input,select,textarea{width:100%;padding:11px;border:2px solid #dfe6f1;border-radius:11px;background:white}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.pri{background:var(--b);color:#fff}.sec{background:#eaf1ff;color:#244ba3}.ghost{background:#fff;border:1px solid var(--l);color:#34415a}.btn:disabled{opacity:.4;cursor:not-allowed}
.stage{display:grid;gap:15px;margin-top:15px}.head{display:flex;gap:14px;padding:18px}.num{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),#8057ff);color:#fff;border-radius:14px;font-weight:900}.head h1{margin:0;font-size:30px}.head p{margin:5px 0;color:var(--m)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{padding:18px}.card h3{margin-top:0}.rule{font-size:26px;font-weight:900;text-align:center;background:#f3f6ff;border-radius:13px;padding:13px;margin:9px 0}.note{background:#fff7e7;border:1px solid #f2d99d;border-radius:13px;padding:12px}.key{background:#eefaf6;border:1px solid #bfe6d5;border-radius:13px;padding:12px}.q{border:1px solid var(--l);background:#fbfdff;border-radius:14px;padding:14px;margin:10px 0}.q b{display:block;margin-bottom:8px}.opts{display:grid;gap:7px}.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--l);padding:9px;border-radius:9px;background:white}.opt input{width:auto}.coords{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.coords input{width:78px;text-align:center;font-weight:800}.fb,.hint{display:none;margin-top:8px;padding:9px 10px;border-radius:9px;font-weight:750}.fb.ok{display:block;background:#eafaf1;color:#167148}.fb.bad{display:block;background:#fff0f3;color:#a73a51}.hint{background:#f2efff;color:#5b43bd}.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.small{font-size:13px;color:var(--m)}canvas{width:100%;max-width:680px;aspect-ratio:4/3;display:block;margin:auto;border:1px solid var(--l);border-radius:14px;background:white}.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:9px}.angles{display:flex;gap:7px;flex-wrap:wrap}.angles button.on{background:var(--b);color:white}.teach{position:fixed;right:16px;bottom:16px;z-index:20;width:min(360px,calc(100vw - 32px));padding:15px;background:white;border:1px solid var(--l);border-radius:16px;box-shadow:0 18px 60px #1d315033}.teachgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sol{margin-top:7px;color:#7b3bc7;font-weight:800}.report{max-width:900px;margin:20px auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);text-align:left}.table th{background:#f1f5fb}
@media(max-width:850px){.grid2,.form,.ctrl{grid-template-columns:1fr}.app{padding:8px}}@media print{.bar,.foot,.teach,.noprint{display:none!important}.card,.head{box-shadow:none}}
</style>
</head>
<body><div class="app"><div id="bar" class="bar hide"><div class="row"><div class="brand">↻ Laboratorio de Rotaciones</div><span id="stud" class="badge"></span><span id="clock" class="badge">⏱ 00:00</span><button class="btn ghost" onclick="teacherOpen()">Modo profesor</button></div><div class="track"><div id="prog" class="prog"></div></div></div><main id="main"></main></div>
<div id="teach" class="teach hide"><div id="tlogin"><b>🔐 Modo profesor</b><input id="pass" type="password" placeholder="Contraseña" style="margin-top:8px"><button class="btn pri" style="width:100%;margin-top:7px" onclick="teacherLogin()">Ingresar</button></div><div id="ttools" class="hide"><b>Herramientas</b><div class="teachgrid" style="margin-top:8px"><select id="stagePick"></select><button class="btn sec" onclick="teacherJump()">Ir</button><button class="btn sec" onclick="teacherDone()">Completar etapa</button><button class="btn sec" onclick="toggleSol()">Soluciones</button><button class="btn ghost" onclick="teacherClose()">Cerrar</button><button class="btn ghost" onclick="resetAll()">Reiniciar</button></div></div></div>
<script>
const stages=[['Inicio y vocabulario',7],['Explorador de giros',9],['90° en el origen',12],['180° y 270°',10],['Centro en otro punto',13],['Figuras completas',12],['Desafío final',7]];
let S=JSON.parse(localStorage.getItem('rotOA13')||'null')||{name:'',course:'8° básico',stage:0,done:Array(7).fill(false),ans:{},att:{},hint:{},elapsed:0,lastSaved:null,teacher:false,sol:false};
// Migración desde versiones anteriores: no contamos como tiempo de trabajo el período en que la página estuvo cerrada.
if(typeof S.elapsed!=='number')S.elapsed=0; delete S.start; if(!S.done||S.done.length!==7)S.done=Array(7).fill(false);
let sessionStartedAt=null,clockInterval=null,autosaveInterval=null;
let E={px:3,py:1,cx:0,cy:0,a:90,d:'ccw'}; const main=document.getElementById('main');
function save(){
  if(sessionStartedAt){S.elapsed=(S.elapsed||0)+Math.floor((Date.now()-sessionStartedAt)/1000);sessionStartedAt=Date.now()}
  S.lastSaved=Date.now();
  localStorage.setItem('rotOA13',JSON.stringify(S));
}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtSaved(ts){if(!ts)return 'sin registro de hora';try{return new Date(ts).toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'})}catch(e){return new Date(ts).toLocaleString()}}
function start(){let n=document.getElementById('name').value.trim();if(!n)return alert('Escribe tu nombre.');S.name=n;S.course=document.getElementById('course').value.trim()||'8° básico';sessionStartedAt=Date.now();save();document.getElementById('bar').classList.remove('hide');timer();render()}
function resume(){document.getElementById('bar').classList.remove('hide');sessionStartedAt=Date.now();timer();render()}
function timer(){
  clearInterval(clockInterval);
  clockInterval=setInterval(()=>{let s=(S.elapsed||0)+(sessionStartedAt?Math.floor((Date.now()-sessionStartedAt)/1000):0),m=String(Math.floor(s/60)).padStart(2,'0'),q=String(s%60).padStart(2,'0');let e=document.getElementById('clock');if(e)e.textContent=`⏱ ${m}:${q}`},1000);
  clearInterval(autosaveInterval);autosaveInterval=setInterval(()=>{if(S.name)save()},5000);
}
function startPage(){
 document.getElementById('bar').classList.add('hide');
 const saved=S.name?`<div class="key" style="margin-top:18px"><b>💾 Hay una sesión guardada en este navegador</b><br>Estudiante: ${esc(S.name)} · Progreso: ${S.done.filter(Boolean).length}/7 etapas · Último guardado: ${fmtSaved(S.lastSaved)}<br><span class="small">Puedes cerrar esta página y, al abrir nuevamente este mismo archivo en el mismo navegador y dispositivo, continuar desde donde quedaste.</span><div style="margin-top:10px"><button class="btn sec" onclick="resume()">Continuar sesión guardada</button></div></div>`:'';
 main.innerHTML=`<section class="hero"><span class="badge">Matemática · 8° básico · OA 13</span><h1>↻ Laboratorio de Rotaciones</h1><h2>Actividad interactiva de aproximadamente 70 minutos</h2><div class="objective"><b>Objetivo:</b> comprender y realizar rotaciones de figuras 2D en el plano cartesiano considerando el centro de rotación (origen o puntos del plano) y giros de 90°, 180° y 270°, en sentido horario y antihorario.</div>${saved}<div class="form"><div><b>Nombre</b><input id="name" value="${esc(S.name)}"></div><div><b>Curso</b><input id="course" value="${esc(S.course)}"></div></div><div class="note"><b>Ruta:</b> reconocer centro, ángulo y sentido → rotar puntos alrededor del origen → rotar respecto de otros centros → rotar figuras completas.<br><b>Guardado automático:</b> respuestas, progreso, intentos, pistas y etapa actual se almacenan en este navegador.</div><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn pri" onclick="start()">${S.name?'Entrar a la actividad':'Comenzar'}</button></div></section>`
}
function H(i,txt){return `<div class="head"><div class="num">${i+1}</div><div><h1>${stages[i][0]}</h1><p>${txt} · tiempo sugerido ${stages[i][1]} min</p></div></div>`}function F(){let p=S.stage?`<button class="btn ghost" onclick="prev()">← Anterior</button>`:'<span></span>';let n=S.stage<6?`<button id="next" class="btn pri" ${(!S.done[S.stage]&&!S.teacher)?'disabled':''} onclick="next()">Siguiente →</button>`:`<button id="next" class="btn pri" ${(!S.done[6]&&!S.teacher)?'disabled':''} onclick="report()">Ver informe</button>`;return `<div class="foot">${p}<span class="small">${S.done[S.stage]?'✅ Etapa completada':'Completa las actividades para avanzar'}</span>${n}</div>`}
function render(){document.getElementById('stud').textContent=`${S.name} · ${S.course}`;document.getElementById('prog').style.width=`${S.done.filter(Boolean).length/7*100}%`;document.getElementById('stagePick').innerHTML=stages.map((x,i)=>`<option value="${i}">${i+1}. ${x[0]}</option>`).join('');document.getElementById('stagePick').value=S.stage;main.innerHTML=[st0,st1,st2,st3,st4,st5,st6][S.stage]();setTimeout(()=>{draws();showSolutions()},30)}
function done(i){S.done[i]=true;save();let b=document.getElementById('next');if(b)b.disabled=false;document.getElementById('prog').style.width=`${S.done.filter(Boolean).length/7*100}%`}function next(){if(!S.done[S.stage]&&!S.teacher)return;S.stage=Math.min(6,S.stage+1);save();render();scrollTo(0,0)}function prev(){S.stage=Math.max(0,S.stage-1);save();render();scrollTo(0,0)}
function hit(k){S.att[k]=(S.att[k]||0)+1;save()}function fb(k,ok,msg){let e=document.getElementById('fb'+k);e.className='fb '+(ok?'ok':'bad');e.textContent=msg}function hint(k,t){S.hint[k]=(S.hint[k]||0)+1;save();let e=document.getElementById('hi'+k);e.style.display='block';e.textContent=t}
function MC(id,q,opts,correct,h){return `<div class="q"><b>${q}</b><div class="opts">${opts.map(o=>`<label class="opt"><input type="radio" name="${id}" value="${o[0]}">${o[1]}</label>`).join('')}</div><div style="margin-top:8px;display:flex;gap:7px"><button class="btn sec" onclick="mc('${id}','${correct}')">Comprobar</button><button class="btn ghost" onclick="hint('${id}','${esc(h)}')">Pista</button></div><div id="hi${id}" class="hint"></div><div id="fb${id}" class="fb"></div><div class="sol hide">Respuesta: ${opts.find(o=>o[0]==correct)[1]}</div></div>`}
function mc(id,c){let e=document.querySelector(`input[name="${id}"]:checked`);if(!e){fb(id,false,'Selecciona una alternativa.');return false}hit(id);S.ans[id]=e.value;save();let ok=e.value===c;fb(id,ok,ok?'¡Correcto!':'Aún no. Revisa centro, ángulo y sentido.');return ok}
function CO(id,q,x,y){return `<div class="q"><b>${q}</b><div class="coords">Imagen: (<input id="${id}x" type="number" placeholder="x′"> , <input id="${id}y" type="number" placeholder="y′">)</div><div style="margin-top:8px;display:flex;gap:7px"><button class="btn sec" onclick="co('${id}',${x},${y})">Comprobar</button><button class="btn ghost" onclick="hint('${id}','Dibuja el vector desde el centro al punto y gira ese vector.')">Pista</button></div><div id="hi${id}" class="hint"></div><div id="fb${id}" class="fb"></div><div class="sol hide">Respuesta: (${x}, ${y})</div></div>`}
function co(id,x,y){let a=Number(document.getElementById(id+'x').value),b=Number(document.getElementById(id+'y').value);if(!Number.isFinite(a)||!Number.isFinite(b)){fb(id,false,'Completa las dos coordenadas.');return false}hit(id);S.ans[id]=[a,b];save();let ok=a===x&&b===y;fb(id,ok,ok?'¡Correcto!':'No coincide todavía. Observa el sentido del giro.');return ok}
function finishCoords(stage,ids,vals){let ok=true;ids.forEach((id,i)=>{if(!co(id,vals[i][0],vals[i][1]))ok=false});if(ok){done(stage);render()}}
function st0(){return `<div class="stage">${H(0,'Activa lo que ya sabes sobre movimiento y orientación')}<div class="grid2"><div class="card"><h3>¿Qué es una rotación?</h3><p>Es un giro de una figura alrededor de un <b>centro de rotación</b>. Para describirla necesitamos:</p><div class="key"><b>Centro</b> · <b>Ángulo</b> · <b>Sentido</b></div><p>↺ antihorario: contrario a las agujas del reloj.<br>↻ horario: como las agujas del reloj.</p><div class="rule">La rotación conserva forma, tamaño y distancias.</div></div><div class="card"><canvas id="c0"></canvas><p class="small">Azul: figura original. Verde: imagen tras un giro de 90° antihorario.</p></div></div><div class="card"><h3>Diagnóstico</h3>${MC('a1','Si la figura gira alrededor del origen, ¿cuál es el centro?',[['a','(0,0)'],['b','(1,0)'],['c','El vértice más cercano']],'a','El origen del plano es (0,0).')}${MC('a2','¿Qué se conserva después de una rotación?',[['a','Forma y tamaño'],['b','Las coordenadas'],['c','El cuadrante']],'a','Una rotación es una transformación rígida.')}${MC('a3','180° horario y 180° antihorario…',[['a','llegan al mismo lugar'],['b','siempre son diferentes'],['c','solo coinciden en el origen']],'a','180° corresponde a media vuelta.')}<button class="btn pri" onclick="f0()">Comprobar etapa</button></div>${F()}</div>`}function f0(){if(mc('a1','a')&&mc('a2','a')&&mc('a3','a')){done(0);render()}}
function st1(){return `<div class="stage">${H(1,'Manipula un punto y observa qué permanece y qué cambia')}<div class="grid2"><div class="card"><h3>Explorador</h3><div class="ctrl"><div>Punto P · x<input id="epx" type="number" value="${E.px}"></div><div>Punto P · y<input id="epy" type="number" value="${E.py}"></div><div>Centro · x<input id="ecx" type="number" value="${E.cx}"></div><div>Centro · y<input id="ecy" type="number" value="${E.cy}"></div></div><p><b>Ángulo</b></p><div class="angles">${[90,180,270].map(a=>`<button class="btn sec ${E.a==a?'on':''}" onclick="E.a=${a};render()">${a}°</button>`).join('')}</div><p><b>Sentido</b></p><div class="angles"><button class="btn sec ${E.d=='ccw'?'on':''}" onclick="E.d='ccw';render()">↺ Antihorario</button><button class="btn sec ${E.d=='cw'?'on':''}" onclick="E.d='cw';render()">↻ Horario</button></div><div style="margin-top:11px"><button class="btn pri" onclick="explore(false)">Actualizar</button> <button class="btn sec" onclick="explore(true)">Animar</button></div><div id="eres" class="key" style="margin-top:10px"></div></div><div class="card"><canvas id="ce"></canvas></div></div><div class="card"><h3>Conclusiones</h3>${MC('b1','¿Qué ocurre con la distancia del punto al centro?',[['a','Se conserva'],['b','Aumenta'],['c','Disminuye']],'a','La distancia al centro permanece igual.')}${MC('b2','90° equivale a…',[['a','un cuarto de vuelta'],['b','media vuelta'],['c','una vuelta']],'a','360° ÷ 4 = 90°.')}${MC('b3','270° antihorario equivale a…',[['a','90° horario'],['b','180° horario'],['c','90° antihorario']],'a','Ambos terminan en la misma posición.')}<button class="btn pri" onclick="f1()">Finalizar exploración</button></div>${F()}</div>`}function f1(){if(mc('b1','a')&&mc('b2','a')&&mc('b3','a')){done(1);render()}}
function st2(){let ids=['c1','c2','c3','c4','c5','c6'],vals=[[-1,2],[-2,-3],[-1,-4],[-4,2],[2,-5],[-5,-1]];return `<div class="stage">${H(2,'Predice las coordenadas y luego comprueba')}<div class="grid2"><div class="card"><h3>Reglas útiles</h3><div class="rule">90° ↺: (x,y) → (−y,x)</div><div class="rule">90° ↻: (x,y) → (y,−x)</div><div class="note">Úsalas como apoyo, pero relaciona cada regla con el giro visual.</div><canvas id="c2"></canvas></div><div class="card"><h3>Práctica</h3>${CO('c1','P(2,1) gira 90° ↺.',-1,2)}${CO('c2','Q(−3,2) gira 90° ↺.',-2,-3)}${CO('c3','R(4,−1) gira 90° ↻.',-1,-4)}${CO('c4','S(−2,−4) gira 90° ↻.',-4,2)}${CO('c5','T(5,2) gira 90° ↻.',2,-5)}${CO('c6','U(−1,5) gira 90° ↺.',-5,-1)}<button class="btn pri" onclick='finishCoords(2,${JSON.stringify(ids)},${JSON.stringify(vals)})'>Comprobar etapa</button></div></div>${F()}</div>`}
function st3(){return `<div class="stage">${H(3,'Trabaja con media vuelta y tres cuartos de vuelta')}<div class="grid2"><div class="card"><div class="rule">180°: (x,y) → (−x,−y)</div><div class="rule">270° ↺ = 90° ↻</div><div class="rule">270° ↻ = 90° ↺</div><canvas id="c3"></canvas></div><div class="card">${CO('d1','A(3,2) gira 180°.',-3,-2)}${CO('d2','B(−4,1) gira 180°.',4,-1)}${CO('d3','C(2,5) gira 270° ↺.',5,-2)}${CO('d4','D(−3,4) gira 270° ↺.',4,3)}${CO('d5','E(1,−4) gira 270° ↻.',4,1)}${CO('d6','F(−2,−3) gira 270° ↻.',3,-2)}</div></div><div class="card">${MC('d7','¿Qué giro lleva un punto al lado opuesto del centro?',[['a','90°'],['b','180°'],['c','270°']],'b','Media vuelta = 180°.')}<button class="btn pri" onclick="f3()">Comprobar etapa</button></div>${F()}</div>`}function f3(){let ids=['d1','d2','d3','d4','d5','d6'],v=[[-3,-2],[4,-1],[5,-2],[4,3],[4,1],[3,-2]],ok=true;ids.forEach((x,i)=>{if(!co(x,v[i][0],v[i][1]))ok=false});if(!mc('d7','b'))ok=false;if(ok){done(3);render()}}
function st4(){let ids=['e1','e2','e3','e4','e5','e6'],vals=[[1,3],[5,-1],[-4,2],[-1,0],[-2,2],[0,-1]];return `<div class="stage">${H(4,'Ahora el centro de rotación puede estar en cualquier punto del plano')}<div class="grid2"><div class="card"><h3>Método en tres pasos</h3><p>1. Mira el desplazamiento desde el centro hasta el punto.</p><p>2. Gira ese desplazamiento.</p><p>3. Ubica el nuevo punto desde el mismo centro.</p><div class="note">Ejemplo: C(1,1), P(3,1). P está 2 unidades a la derecha del centro. Al girar 90° ↺ queda 2 unidades arriba: P′=(1,3).</div><canvas id="c4"></canvas></div><div class="card">${CO('e1','Centro C(1,1). P(3,1) gira 90° ↺.',1,3)}${CO('e2','Centro C(2,−1). P(2,2) gira 90° ↻.',5,-1)}${CO('e3','Centro C(−1,2). P(2,2) gira 180°.',-4,2)}${CO('e4','Centro C(1,−2). P(3,0) gira 90° ↺.',-1,0)}${CO('e5','Centro C(−2,−1). P(1,−1) gira 90° ↺.',-2,2)}${CO('e6','Centro C(2,2). P(4,5) gira 180°.',0,-1)}<button class="btn pri" onclick='finishCoords(4,${JSON.stringify(ids)},${JSON.stringify(vals)})'>Comprobar etapa</button></div></div>${F()}</div>`}
function st5(){return `<div class="stage">${H(5,'Rota cada vértice y conserva la forma de la figura')}<div class="card"><h3>Ejemplo visual</h3><p>Triángulo A(1,1), B(4,1), C(1,3) gira 90° ↺ alrededor del origen.</p><canvas id="c5"></canvas><div class="key">Una figura rota cuando <b>todos sus vértices</b> giran el mismo ángulo, sentido y centro.</div></div><div class="grid2"><div class="card"><h3>Triángulo · 90° ↺</h3>${CO('f1','A′',-1,1)}${CO('f2','B′',-1,4)}${CO('f3','C′',-3,1)}</div><div class="card"><h3>Rectángulo · 180°</h3><p>P(1,1), Q(3,1), R(3,2), S(1,2)</p>${CO('f4','P′',-1,-1)}${CO('f5','Q′',-3,-1)}${CO('f6','R′',-3,-2)}${CO('f7','S′',-1,-2)}</div></div><div class="card"><h3>Centro O(1,1), triángulo A(2,1), B(2,3), C(4,1), giro 90° ↺</h3>${CO('f8','A′',1,2)}${CO('f9','B′',-1,2)}${CO('f10','C′',1,4)}<button class="btn pri" onclick="f5()">Comprobar figuras</button></div>${F()}</div>`}function f5(){let ids=['f1','f2','f3','f4','f5','f6','f7','f8','f9','f10'],v=[[-1,1],[-1,4],[-3,1],[-1,-1],[-3,-1],[-3,-2],[-1,-2],[1,2],[-1,2],[1,4]],ok=true;ids.forEach((x,i)=>{if(!co(x,v[i][0],v[i][1]))ok=false});if(ok){done(5);render()}}
function st6(){return `<div class="stage">${H(6,'Mezcla de situaciones para verificar el objetivo')}<div class="grid2"><div class="card"><h3>Coordenadas</h3>${CO('g1','P(4,−2) gira 90° ↺ en el origen.',2,4)}${CO('g2','Q(−5,1) gira 180°.',5,-1)}${CO('g3','R(2,−3) gira 270° ↻.',3,2)}${CO('g4','Centro O(1,2). S(4,2) gira 90° ↻.',1,-1)}</div><div class="card"><h3>Comprensión</h3>${MC('g5','¿Qué pasa con la longitud de los lados al rotar una figura?',[['a','Se conserva'],['b','Aumenta'],['c','Depende del cuadrante']],'a','La rotación es rígida.')}${MC('g6','90° horario equivale a…',[['a','270° antihorario'],['b','180°'],['c','90° antihorario']],'a','Ambos llegan a la misma posición.')}${MC('g7','Para girar en torno a un centro distinto del origen debes…',[['a','usar ese centro como referencia'],['b','ignorar el centro'],['c','cambiar el tamaño']],'a','La rotación se define respecto de su centro.')}</div></div><div class="card"><h3>Ticket de salida</h3><p>Triángulo A(1,0), B(3,0), C(1,2) gira 90° horario alrededor del origen.</p>${CO('g8','A′',0,-1)}${CO('g9','B′',0,-3)}${CO('g10','C′',2,-1)}<b>Explica qué tres datos necesitas para realizar una rotación:</b><textarea id="refl" rows="4">${esc(S.ans.refl||'')}</textarea><button class="btn pri" style="margin-top:10px" onclick="f6()">Finalizar actividad</button><div id="fbfin" class="fb"></div></div>${F()}</div>`}function f6(){let ids=['g1','g2','g3','g4','g8','g9','g10'],v=[[2,4],[5,-1],[3,2],[1,-1],[0,-1],[0,-3],[2,-1]],ok=true;ids.forEach((x,i)=>{if(!co(x,v[i][0],v[i][1]))ok=false});['g5','g6','g7'].forEach(x=>{if(!mc(x,'a'))ok=false});let t=document.getElementById('refl').value.trim();S.ans.refl=t;save();if(t.length<25){let e=document.getElementById('fbfin');e.className='fb bad';e.textContent='Escribe una explicación un poco más completa.';ok=false}if(ok){done(6);render()}}
function rot(p,c,a,d){let z=(d==='ccw'?a:-a)*Math.PI/180,dx=p.x-c.x,dy=p.y-c.y;return{x:c.x+dx*Math.cos(z)-dy*Math.sin(z),y:c.y+dx*Math.sin(z)+dy*Math.cos(z)}}function rd(n){n=Math.round(n*1000)/1000;return Math.abs(n)<1e-8?0:n}
function plane(cv,orig=[],img=[],center={x:0,y:0},labels=true){let x=cv.getContext('2d'),W=cv.width=680,H=cv.height=510,s=38,ox=W/2,oy=H/2;x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#e4eaf3';x.lineWidth=1;for(let i=-8;i<=8;i++){x.beginPath();x.moveTo(ox+i*s,0);x.lineTo(ox+i*s,H);x.stroke()}for(let j=-6;j<=6;j++){x.beginPath();x.moveTo(0,oy-j*s);x.lineTo(W,oy-j*s);x.stroke()}x.strokeStyle='#6a7890';x.lineWidth=2;x.beginPath();x.moveTo(0,oy);x.lineTo(W,oy);x.stroke();x.beginPath();x.moveTo(ox,0);x.lineTo(ox,H);x.stroke();x.fillStyle='#67748b';x.font='12px Arial';for(let i=-8;i<=8;i++)if(i)x.fillText(i,ox+i*s-4,oy+15);for(let j=-6;j<=6;j++)if(j)x.fillText(j,ox+7,oy-j*s+4);let M=p=>({x:ox+p.x*s,y:oy-p.y*s});function poly(P,col,fill){if(!P.length)return;x.beginPath();let q=M(P[0]);x.moveTo(q.x,q.y);for(let i=1;i<P.length;i++){q=M(P[i]);x.lineTo(q.x,q.y)}if(P.length>1)x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=col;x.lineWidth=3;x.stroke();P.forEach((p,i)=>{q=M(p);x.fillStyle=col;x.beginPath();x.arc(q.x,q.y,5,0,Math.PI*2);x.fill();if(labels){x.font='bold 14px Arial';x.fillText(String.fromCharCode(65+i),q.x+7,q.y-7)}})}poly(orig,'#3867ff','#3867ff18');poly(img,'#16a36a','#16a36a18');let q=M(center);x.fillStyle='#dd526b';x.beginPath();x.arc(q.x,q.y,7,0,Math.PI*2);x.fill();x.font='bold 13px Arial';x.fillText('Centro',q.x+9,q.y-8)}
function explore(anim){['px','py','cx','cy'].forEach(k=>E[k]=Number(document.getElementById('e'+k).value));let p={x:E.px,y:E.py},c={x:E.cx,y:E.cy},t=rot(p,c,E.a,E.d);document.getElementById('eres').innerHTML=`P=(${E.px},${E.py}) → <b>P′=(${rd(t.x)},${rd(t.y)})</b><br>Centro=(${E.cx},${E.cy}), ${E.a}° ${E.d==='ccw'?'antihorario':'horario'}`;let cv=document.getElementById('ce');if(!anim){plane(cv,[p],[t],c,false);return}let st=performance.now();function fr(now){let u=Math.min(1,(now-st)/900),q=rot(p,c,E.a*u,E.d);plane(cv,[p],[q],c,false);if(u<1)requestAnimationFrame(fr)}requestAnimationFrame(fr)}
function draws(){let c=document.getElementById('c0');if(c){let t=[{x:1,y:1},{x:4,y:1},{x:2,y:3}];plane(c,t,t.map(p=>rot(p,{x:0,y:0},90,'ccw')),{x:0,y:0})}if(document.getElementById('ce'))explore(false);c=document.getElementById('c2');if(c)plane(c,[{x:2,y:1}],[{x:-1,y:2}],{x:0,y:0},false);c=document.getElementById('c3');if(c)plane(c,[{x:3,y:2}],[{x:-3,y:-2}],{x:0,y:0},false);c=document.getElementById('c4');if(c)plane(c,[{x:3,y:1}],[{x:1,y:3}],{x:1,y:1},false);c=document.getElementById('c5');if(c){let t=[{x:1,y:1},{x:4,y:1},{x:1,y:3}];plane(c,t,t.map(p=>rot(p,{x:0,y:0},90,'ccw')),{x:0,y:0})}}
function teacherOpen(){document.getElementById('teach').classList.remove('hide');if(S.teacher){document.getElementById('tlogin').classList.add('hide');document.getElementById('ttools').classList.remove('hide')}}function teacherClose(){document.getElementById('teach').classList.add('hide')}function teacherLogin(){if(document.getElementById('pass').value==='Stik'){S.teacher=true;save();document.getElementById('tlogin').classList.add('hide');document.getElementById('ttools').classList.remove('hide');render()}else alert('Contraseña incorrecta')}function teacherJump(){S.stage=Number(document.getElementById('stagePick').value);save();teacherClose();render()}function teacherDone(){done(S.stage);render()}function toggleSol(){S.sol=!S.sol;save();showSolutions()}function showSolutions(){document.querySelectorAll('.sol').forEach(e=>e.classList.toggle('hide',!S.sol))}function resetAll(){if(confirm('¿Reiniciar todo el progreso?')){localStorage.removeItem('rotOA13');location.reload()}}
function report(){let at=Object.values(S.att).reduce((a,b)=>a+b,0),hi=Object.values(S.hint).reduce((a,b)=>a+b,0),pct=Math.round(S.done.filter(Boolean).length/7*100);main.innerHTML=`<div class="report"><div class="head"><div class="num">✓</div><div><h1>Informe de aprendizaje</h1><p>Rotaciones en el plano cartesiano</p></div></div><div class="grid2" style="margin-top:15px"><div class="card"><h2>${esc(S.name)}</h2><p><b>Curso:</b> ${esc(S.course)}</p><p><b>Progreso:</b> ${pct}%</p><p><b>Intentos:</b> ${at}</p><p><b>Pistas:</b> ${hi}</p></div><div class="card"><h3>Reflexión final</h3><p>${esc(S.ans.refl||'Sin respuesta')}</p></div></div><div class="card" style="margin-top:15px"><table class="table"><tr><th>Etapa</th><th>Estado</th></tr>${stages.map((x,i)=>`<tr><td>${i+1}. ${x[0]}</td><td>${S.done[i]?'✅ Completada':'⬜ Pendiente'}</td></tr>`).join('')}</table></div><div class="card noprint" style="margin-top:15px"><button class="btn pri" onclick="window.print()">Imprimir / Guardar PDF</button> <button class="btn sec" onclick="render()">Volver</button></div></div>`}
